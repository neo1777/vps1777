name: Canale di aggiornamento (firmato, con scadenza)

# SIC-15: il PUNTATORE all'ultima release stabile, firmato e con una scadenza. L'aggiornamento
# automatico delle macchine lo pretende fresco (tools/vps1777.py, «il canale firmato»): chi
# rispondesse per mesi «l'ultima è quella che hai» verrebbe scoperto alla scadenza.
#
# Scrive `canale.json` ({latest, firmato_il, scade_il}), lo firma keyless con cosign (l'identità è
# QUESTO workflow su main: il client accetta solo lei) e lo pubblica, con firma e certificato,
# sul ramo `canale-firmato`, in un file solo (`canale.bundle.json`: testo, firma e certificato).
# Su un ramo e non in una release: le release di questo repository sono immutabili, e un allegato
# pubblicato non si può sostituire ogni settimana (provato il 24/11/2026: HTTP 422).
#
# Vita 45 giorni, rinfresco ogni settimana: un giro saltato non ferma nessuno, sei sì. Se questo
# workflow si rompe e nessuno lo ripara, dopo 45 giorni le macchine SMETTONO di aggiornarsi da sole
# e avvisano su Telegram: è il prezzo scelto (22/11/2026), e l'aggiornamento a mano resta.
on:
  schedule:
    - cron: "10 5 * * 1"      # ogni lunedì alle 05:10 UTC
  workflow_dispatch:           # e subito dopo ogni rilascio: lo lancia release.yml

permissions: {}

concurrency:
  group: canale
  cancel-in-progress: false

jobs:
  firma:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # un commit sul ramo `canale-firmato` (mai su main)
      id-token: write        # firma keyless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main          # il canale si firma SEMPRE dal codice di main, anche se lanciato a mano
      - name: Solo da main
        run: |
          [ "${GITHUB_REF}" = "refs/heads/main" ] || { echo "::error::il canale si firma solo da main (qui: ${GITHUB_REF}): l'identità della firma sarebbe un'altra e le macchine la rifiuterebbero"; exit 1; }
      - name: L'ultima release stabile
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ULTIMA="$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName -q '.[0].tagName')"
          [[ "$ULTIMA" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::l'ultima release stabile non è una versione: «$ULTIMA»"; exit 1; }
          echo "ultima=$ULTIMA" >> "$GITHUB_OUTPUT"; echo "ultima stabile: $ULTIMA"
      - name: Scrive canale.json
        run: |
          set -euo pipefail
          python3 tools/canale-genera.py genera --latest "${{ steps.rel.outputs.ultima }}" > canale.json
          cat canale.json
      - name: Install cosign
        # stessa versione di release.yml: v4 cambia `sign-blob` e la verifica nella CLI
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Firma (keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature canale.json.sig \
            --output-certificate canale.json.pem \
            canale.json
      # La firma si RILEGGE come la leggerà la macchina: stessa identità, stesso emittente.
      - name: La firma è quella che le macchine accettano
        run: |
          cosign verify-blob \
            --certificate-identity-regexp '^https://github\.com/${{ github.repository_owner }}/vps1777/\.github/workflows/canale\.yml@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --signature canale.json.sig --certificate canale.json.pem canale.json
      - name: Pubblica sul ramo `canale-firmato`
        run: |
          set -euo pipefail
          python3 tools/canale-genera.py impacchetta canale.json > canale.bundle.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin canale-firmato 2>/dev/null; then
            git worktree add -q --detach pubblica FETCH_HEAD
          else
            # prima volta: un ramo senza storia in comune con main, che contiene solo il canale
            git worktree add -q --detach pubblica
            git -C pubblica checkout -q --orphan canale-firmato
            git -C pubblica rm -rfq .
          fi
          cp canale.bundle.json pubblica/
          printf '%s\n' "Questo ramo contiene solo \`canale.bundle.json\`: il puntatore firmato all'ultima release stabile di vps1777, con la sua scadenza. Lo scrive ogni settimana \`.github/workflows/canale.yml\` (su main). Non si modifica a mano: una modifica rompe la firma e le macchine la rifiutano. Vedi docs/UPDATE.md su main." > pubblica/README.md
          git -C pubblica add -A
          git -C pubblica commit -q -m "canale: ${{ steps.rel.outputs.ultima }}, firmato il $(date -u +%F)"
          # ogni rinfresco è un commit in più, mai una riscrittura: la storia del ramo è l'elenco delle firme
          git -C pubblica push -q origin HEAD:refs/heads/canale-firmato
      - name: Ciò che è pubblicato è ciò che è stato firmato
        run: |
          set -euo pipefail
          mkdir riletto && cd riletto
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/canale-firmato/canale.bundle.json"
          for i in 1 2 3 4 5 6; do
            curl -fsS -m 20 -o canale.bundle.json "$URL" && cmp -s canale.bundle.json ../canale.bundle.json && break
            sleep 30     # la CDN dei file grezzi tiene la copia vecchia qualche minuto
          done
          cmp canale.bundle.json ../canale.bundle.json
          python3 -c "import json;b=json.load(open('canale.bundle.json'));[open(n,'w').write(b[k]) for n,k in (('canale.json','canale'),('canale.json.sig','sig'),('canale.json.pem','pem'))]"
          cosign verify-blob \
            --certificate-identity-regexp '^https://github\.com/${{ github.repository_owner }}/vps1777/\.github/workflows/canale\.yml@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --signature canale.json.sig --certificate canale.json.pem canale.json
          echo "canale pubblicato: $(cat canale.json)"
