name: Rebuild mensile (CVE con fix)

# Una volta al mese guarda le immagini PUBBLICATE con gli stessi occhi della pagina
# Security (--ignore-unfixed) e:
#   · 0 CVE con fix   → verde, nessuna azione (e lo dice).
#   · ≥1 CVE con fix  → apre (o commenta) una issue con i pacchetti da aggiornare e cosa
#     serve per farlo: il digest della base nei Dockerfile e i lock delle librerie.
#
# Il nome resta «rebuild» per storia: fino al 21/11/2026 il rimedio dichiarato era
# «ricostruire le immagini» (e, col secret RELEASE_PAT, un tag automatico). Da quando la
# base è fissata per digest (#338) ricostruire non assorbe più niente: vedi il passo in fondo.
# Il workflow non crea tag e non usa nessun secret oltre al GITHUB_TOKEN.

on:
  schedule:
    - cron: "0 5 3 * *"   # il 3 del mese alle 5:00 UTC (dopo il backup notturno)
  workflow_dispatch:

# Niente a livello di workflow: le scritture le dichiara il job che le usa
# (Scorecard, Token-Permissions — test_scorecard_permessi_e_digest.py).
permissions: {}

jobs:
  valuta-e-agisci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read         # dal 21/11 il workflow non tagga più: legge e apre una issue
      issues: write          # la via di fallback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # servono i tag per calcolare la patch successiva

      # P9 (11/10/2026): nlm è pinnato a mano (dependabot.yml ne ignora i minor, di proposito).
      # Una volta al mese si misura quanto è indietro: oltre 30 giorni dal primo rilascio
      # stabile saltato si apre (o si commenta) una issue. Non aggiorna da sé: il salto si fa
      # col metodo scritto in dependabot.yml. Sta qui in testa perché non dipende dalle scansioni.
      - name: nlm è indietro di più di un mese?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RC=0
          python3 tools/nlm-cadenza.py > nlm.txt || RC=$?   # 1 e 2 non fermano il passo
          cat nlm.txt
          # 2 = «non ho potuto misurare» (PyPI non risponde, risposta illeggibile): non è «in
          # regola». Prima era un avviso con uscita 0, cioè un verde mensile che nessuno apre.
          if [ "$RC" = 2 ]; then echo "::error::cadenza di nlm NON misurata: $(cat nlm.txt)"; exit 1; fi
          [ "$RC" = 1 ] || exit 0
          TITOLO="nlm (notebooklm-mcp-cli) indietro di più di un mese"
          CORPO="$(printf 'Il giro mensile del %s dice:\n\n> %s\n\nIl salto si fa a mano, in una PR, col metodo di `.github/dependabot.yml`: changelog a monte, `--help` dei comandi usati da `core.py`, chiavi dei JSON su un account vero, contract-test (`tools/check.sh`).' "$(date -u +%F)" "$(cat nlm.txt)")"
          ESISTENTE="$(gh issue list --state open --search "in:title \"nlm (notebooklm-mcp-cli) indietro\"" --json number -q '.[0].number' || true)"
          if [ -n "$ESISTENTE" ]; then
            gh issue comment "$ESISTENTE" --body "$CORPO"
          else
            gh issue create --title "$TITOLO" --body "$CORPO"
          fi

      # 23/11/2026: le basi fissate per digest sono rimaste indietro? Dependabot dovrebbe spostare il
      # digest ogni settimana, ma dal 27/09 al 21/11 non ha mai proposto quello di python:3.12-slim e
      # nessuno lo vedeva. Qui si misura: digest fissato contro quello che il registro dà oggi, con
      # una soglia di 45 giorni dal giorno in cui il digest è entrato nel repo (serve la storia: fetch-depth 0).
      - name: Le basi delle immagini sono rimaste indietro?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RC=0
          python3 tools/base-cadenza.py > basi.txt || RC=$?   # 1 e 2 non fermano il passo
          cat basi.txt
          if [ "$RC" = 2 ]; then echo "::error::età delle basi NON misurata: $(cat basi.txt)"; exit 1; fi
          [ "$RC" = 1 ] || exit 0
          TITOLO="Immagini base indietro di più di 45 giorni"
          CORPO="$(printf 'Il giro mensile del %s dice:\n\n```\n%s\n```\n\nSi sposta il digest nelle righe `FROM` dei Dockerfile indicati (tutte insieme per la stessa base), in una PR: la CI ricostruisce le immagini e rilancia le prove. Se Dependabot non lo ha proposto da sé, guardare perché (`.github/dependabot.yml`, blocco docker).' "$(date -u +%F)" "$(cat basi.txt)")"
          ESISTENTE="$(gh issue list --state open --search "in:title \"Immagini base indietro\"" --json number -q '.[0].number' || true)"
          if [ -n "$ESISTENTE" ]; then
            gh issue comment "$ESISTENTE" --body "$CORPO"
          else
            gh issue create --title "$TITOLO" --body "$CORPO"
          fi

      # Un solo job, niente matrice: il verdetto è la SOMMA sulle 6 immagini, e
      # 6 job separati non possono sommarsi senza un settimo che li aspetti.
      # (caddy-dns01 entra il 01/10/2026: è opzionale per chi installa, ma è un'immagine
      # NOSTRA — se la sua base Alpine ha un fix, il rebuild lo deve vedere.)
      - name: Scan gateway
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {image-ref: "ghcr.io/${{ github.repository_owner }}/vps1777-gateway:latest", format: json, output: cve-gateway.json, ignore-unfixed: true, severity: "CRITICAL,HIGH,MEDIUM,LOW"}
      - name: Scan archive-mcp
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {image-ref: "ghcr.io/${{ github.repository_owner }}/vps1777-archive-mcp:latest", format: json, output: cve-archive-mcp.json, ignore-unfixed: true, severity: "CRITICAL,HIGH,MEDIUM,LOW"}
      - name: Scan nb1777-mcp
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {image-ref: "ghcr.io/${{ github.repository_owner }}/vps1777-nb1777-mcp:latest", format: json, output: cve-nb1777-mcp.json, ignore-unfixed: true, severity: "CRITICAL,HIGH,MEDIUM,LOW"}
      - name: Scan nb1777-bot
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {image-ref: "ghcr.io/${{ github.repository_owner }}/vps1777-nb1777-bot:latest", format: json, output: cve-nb1777-bot.json, ignore-unfixed: true, severity: "CRITICAL,HIGH,MEDIUM,LOW"}
      - name: Scan ocr
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {image-ref: "ghcr.io/${{ github.repository_owner }}/vps1777-ocr:latest", format: json, output: cve-ocr.json, ignore-unfixed: true, severity: "CRITICAL,HIGH,MEDIUM,LOW"}
      - name: Scan caddy-dns01
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {image-ref: "ghcr.io/${{ github.repository_owner }}/vps1777-caddy-dns01:latest", format: json, output: cve-caddy-dns01.json, ignore-unfixed: true, severity: "CRITICAL,HIGH,MEDIUM,LOW"}

      - name: Conta le CVE con fix (la somma è il verdetto)
        id: conta
        run: |
          set -euo pipefail
          TOT=0
          : > elenco.txt
          for s in gateway archive-mcp nb1777-mcp nb1777-bot ocr caddy-dns01; do
            n="$(jq '[.Results[]?.Vulnerabilities[]?] | length' "cve-$s.json")"
            jq -r --arg s "$s" '.Results[]?.Vulnerabilities[]? | "\($s): \(.VulnerabilityID) \(.Severity) \(.PkgName) \(.InstalledVersion) → \(.FixedVersion)"' "cve-$s.json" >> elenco.txt
            echo "· $s: $n"
            TOT=$((TOT + n))
          done
          sort -u elenco.txt -o elenco.txt
          echo "totale=$TOT" >> "$GITHUB_OUTPUT"
          echo "── CVE con fix, totale (con doppioni per pacchetto): $TOT"
          cat elenco.txt

      # 21/11/2026 — QUESTO PASSO NON TAGGA PIÙ, e la issue non dice più «basta ricostruire».
      # Dal 27/09 (#338) la base `python:3.12-slim` è fissata per DIGEST e le librerie Python
      # vengono dal lock: ricostruire dà le stesse immagini con le stesse CVE (misurato: 216
      # il 03/10, 368 il 03/11, con una release in mezzo). E col PAT il tag automatico sarebbe
      # finito su un main con VERSION e CHANGELOG fermi: release.yml lo rifiuta, e il numero
      # (immutabile) sarebbe andato bruciato. La cura vera è una PR, e la issue dice quale.
      - name: Apri o aggiorna la issue (cosa serve davvero)
        if: steps.conta.outputs.totale != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TOTALE: ${{ steps.conta.outputs.totale }}
        run: |
          set -euo pipefail
          # per pacchetto, non per CVE: l'elenco intero sta nel log del run (centinaia di righe)
          awk -F': ' '{split($2, a, " "); print $1 ": " a[3] " " a[4] " → " $NF}' elenco.txt \
            | sed 's/ → .* → / → /' | sort | uniq -c | sort -rn | head -60 > per-pacchetto.txt
          TITOLO="CVE con fix nelle immagini pubblicate"
          CORPO="$(printf 'Il giro mensile del %s ha trovato **%s** CVE con fix disponibile nelle immagini pubblicate. Per pacchetto (quante, immagine, pacchetto e versione installata; elenco intero nel log del run):\n\n```\n%s\n```\n\n**Ricostruire non basta**: la base è fissata per digest e le librerie dal lock. Serve una PR che:\n\n1. aggiorni il digest di `python:3.12-slim` (e di `caddy`) nei `Dockerfile`, per i pacchetti Debian/Alpine;\n2. rigeneri i lock per le librerie Python elencate: `uv lock -P <pacchetto>` in ogni servizio che le porta;\n3. passi da `tools/check.sh` e da una release di patch, con la prova dal vivo.' "$(date -u +%F)" "$TOTALE" "$(cat per-pacchetto.txt)")"
          ESISTENTE="$(gh issue list --state open --search "in:title \"CVE con fix nelle immagini\"" --json number -q '.[0].number' || true)"
          if [ -n "$ESISTENTE" ]; then
            gh issue comment "$ESISTENTE" --body "$CORPO"
          else
            gh issue create --title "$TITOLO" --body "$CORPO"
          fi
