name: Release

# Su tag v* (da qualunque branch):
#   guard   → VERSION file == tag (e CHANGELOG ha la sezione, per le stable)
#   release → build+push delle immagini su ghcr (le 5 dello stack + caddy-dns01,
#             opzionale), firmate cosign keyless
#   bundle  → runtime bundle (file non-immagine + images.lock) allegato a una
#             GitHub Release; la Release è endpoint di check (/releases/latest),
#             sorgente changelog e host del bundle per `vps1777 update`.
#
# I tag prerelease (v1.2.3-rc.1) NON aggiornano :latest e la Release è marcata
# prerelease → invisibile a /releases/latest → gli utenti non vengono notificati.

on:
  push:
    tags: ["v*"]

# Least privilege per-job (non un blocco unico al workflow): il floor è read,
# ogni job alza SOLO ciò che gli serve. Prima guard — che si limita a leggere
# VERSION/CHANGELOG — ereditava packages:write e id-token:write che non usa.
permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Legge soltanto il repo: nessuna scrittura, nessun token OIDC.
    # actions:read serve alla guard CI-verde (interroga i run del commit).
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.ver.outputs.VERSION }}
      prerelease: ${{ steps.ver.outputs.PRERELEASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Il nome del tag finisce nel testo di più passi (`${{ needs.guard.outputs.version }}`):
          # qui se ne pretende la forma, così un tag con un nome strano si ferma al primo passo.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::il tag «$GITHUB_REF_NAME» non ha la forma vX.Y.Z[-pre]: non rilascio"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "PRERELEASE=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_OUTPUT" ;;
          esac
      # VERSION nel repo deve combaciare col tag: sincronia per costruzione,
      # non per convenzione. Per le prerelease basta la base (v0.9.0-rc.1 ok
      # sia con VERSION=0.9.0-rc.1 sia con VERSION=0.9.0).
      - name: Guard — VERSION file matches tag
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${TAG_VERSION%%-*}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ] && [ "$FILE_VERSION" != "$BASE_VERSION" ]; then
            echo "::error::VERSION ($FILE_VERSION) non combacia col tag ($TAG_VERSION)"
            exit 1
          fi
      - name: Guard — CHANGELOG has the release section (stable only)
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          case "$TAG_VERSION" in
            *-*) echo "prerelease: guard CHANGELOG saltata"; exit 0 ;;
          esac
          grep -q "^## \[$TAG_VERSION\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md senza sezione '## [$TAG_VERSION]'"
            exit 1
          }
      # La firma certifica l'ORIGINE di un artefatto, non che lo stato firmato
      # abbia superato i propri controlli (H24, seconda metà — imparata il
      # 26/07: v0.40.3 taggata su un commit la cui CI era rossa, e i fix sono
      # arrivati DOPO il tag, fuori dalla release). L'ordine giusto è
      # «CI verde → tag», e questa guard lo rende vero per costruzione:
      # senza un run CI concluso in success sul commit taggato, niente release.
      # Il poll copre il caso legittimo di tag e branch pushati insieme
      # (la CI del commit è ancora in corso: si aspetta, non si boccia).
      - name: Guard — la CI del commit taggato è VERDE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            CONCLUSION="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "assente"')"
            case "$CONCLUSION" in
              success)
                echo "CI verde sul commit taggato (${GITHUB_SHA}): si procede."
                exit 0 ;;
              null|assente|"")
                echo "CI del commit non ancora conclusa (tentativo $i/30): attendo 30s…"
                sleep 30 ;;
              *)
                echo "::error::La CI sul commit taggato è '${CONCLUSION}', non 'success'."
                echo "::error::Niente release da uno stato che non passa i propri controlli:"
                echo "::error::porta la CI al verde su questo commit, poi ri-tagga."
                exit 1 ;;
            esac
          done
          echo "::error::CI del commit taggato mai conclusa dopo 15 minuti: release fermata."
          echo "::error::Verifica lo stato della CI e ri-lancia il workflow (o ri-tagga a CI verde)."
          exit 1

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: guard
    # Pubblica su GHCR (packages:write) e firma keyless (id-token:write).
    # NON crea Release → niente contents:write.
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        # caddy-dns01 (01/10/2026): immagine OPZIONALE (feature caddy-dns01), ma esce da
        # qui come le altre — build, firma, digest in images.lock — perché chi la accende
        # deve poterla verificare come il resto. `vps1777 update` verifica solo le
        # immagini che lo stack usa davvero (`immagini_attive`), quindi a feature spenta
        # questa voce del lock non pesa.
        service: [gateway, archive-mcp, nb1777-mcp, nb1777-bot, ocr, caddy-dns01]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # :latest segue SOLO le release stable — mai le prerelease.
      - name: Compute tags
        id: tags
        run: |
          BASE="ghcr.io/${{ github.repository_owner }}/vps1777-${{ matrix.service }}"
          {
            echo "TAGS<<EOF"
            echo "$BASE:${{ needs.guard.outputs.version }}"
            if [ "${{ needs.guard.outputs.prerelease }}" = "false" ]; then
              echo "$BASE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build & push ${{ matrix.service }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}
          build-args: |
            VPS1777_VERSION=${{ needs.guard.outputs.version }}
          provenance: true
          sbom: true
      - name: Install cosign
        # HELD a v3: cosign v4 cambia `sign-blob` (crea un bundle di default →
        # rompe la firma detached SHA256SUMS.sig/.pem su cui si appoggia
        # `vps1777 update`). Verificato con la rc v0.36.0-rc.1. cosign-installer
        # NON è una action Node → non c'entra col warning Node 20; il bump a v4
        # richiederebbe di cambiare anche la verifica (verify-blob) nel CLI.
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign image (keyless)
        # Per digest, non per tag (H80): il tag si può spostare fra il push e la firma.
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/vps1777-${{ matrix.service }}@${{ steps.build.outputs.digest }}

  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [guard, release]
    # Crea la GitHub Release (contents:write), rilegge i digest da GHCR
    # (packages:read) e firma il blob keyless (id-token:write).
    permissions:
      contents: write
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # images.lock: digest immutabili delle immagini appena pushate (una per servizio).
      # È il gate supply-chain di `vps1777 update`: dopo il pull, i RepoDigests
      # locali DEVONO combaciare con questo lock.
      - name: Resolve image digests → images.lock
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          lock='{}'
          for svc in gateway archive-mcp nb1777-mcp nb1777-bot ocr caddy-dns01; do
            ref="ghcr.io/${OWNER}/vps1777-${svc}:${VERSION}"
            digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r '.digest')"
            [ -n "$digest" ] && [ "$digest" != "null" ] || { echo "::error::digest non risolto per $ref"; exit 1; }
            lock="$(echo "$lock" | jq --arg s "$svc" --arg r "ghcr.io/${OWNER}/vps1777-${svc}@${digest}" '. + {($s): $r}')"
          done
          echo "$lock" | jq . > images.lock
          cat images.lock
      # Il runtime bundle: SOLO i path gestiti (niente sorgenti/installer/doc
      # di sviluppo). bundle-manifest.json permette all'updater di cancellare
      # i file gestiti rimossi a monte (risolve la staleness del tar).
      - name: Assemble runtime bundle
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          # La ricetta sta in tools/assembla-pacchetto.sh: la stessa che la CI costruisce due volte e
          # confronta (tools/tests/test-pacchetto-riproducibile.sh). La data è quella del commit del tag.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          bash tools/assembla-pacchetto.sh "${VERSION}" .
      - name: Install cosign
        # HELD a v3: cosign v4 cambia `sign-blob` (crea un bundle di default →
        # rompe la firma detached SHA256SUMS.sig/.pem su cui si appoggia
        # `vps1777 update`). Verificato con la rc v0.36.0-rc.1. cosign-installer
        # NON è una action Node → non c'entra col warning Node 20; il bump a v4
        # richiederebbe di cambiare anche la verifica (verify-blob) nel CLI.
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign SHA256SUMS (keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS
      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            printf 'Prerelease di test `v%s` — non destinata agli utenti.\n' "$VERSION" > release-notes.md
          else
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" {found=1; next}
              found && /^## \[/ {exit}
              found {print}
            ' CHANGELOG.md > release-notes.md
            [ -s release-notes.md ] || printf 'Release v%s (vedi CHANGELOG.md).\n' "$VERSION" > release-notes.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          prerelease: ${{ needs.guard.outputs.prerelease == 'true' }}
          body_path: release-notes.md
          files: |
            vps1777-runtime-v${{ needs.guard.outputs.version }}.tar.gz
            SHA256SUMS
            SHA256SUMS.sig
            SHA256SUMS.pem
      # La release si RILEGGE dall'API: «creata» lo dice ciò che GitHub serve adesso, non il
      # fatto che l'azione qui sopra non abbia sollevato. Senza uno dei quattro allegati
      # l'updater delle macchine installate non può verificare né scaricare.
      - name: La release pubblicata ha i quattro allegati
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONE: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          nomi="$(gh release view "v$VERSIONE" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          echo "$nomi"
          for atteso in "vps1777-runtime-v$VERSIONE.tar.gz" SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem; do
            grep -qxF "$atteso" <<<"$nomi" || { echo "::error::nella release v$VERSIONE manca l'allegato $atteso"; exit 1; }
          done

  # SIC-15: appena la release è pubblicata si rinfresca il canale firmato, così il puntatore
  # dice subito la versione nuova (il giro settimanale di canale.yml lo farebbe entro lunedì).
  # Si LANCIA canale.yml, non lo si richiama come workflow riusabile: la firma deve portare
  # l'identità «canale.yml su main», l'unica che le macchine accettano; richiamato da qui
  # porterebbe quella del tag. Se il lancio fallisce il rilascio resta valido: lo dice un avviso.
  canale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [guard, bundle]
    if: needs.guard.outputs.prerelease != 'true'
    permissions:
      actions: write         # lanciare un workflow_dispatch
    steps:
      - name: Rinfresca il canale firmato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run canale.yml --ref main --repo "$GITHUB_REPOSITORY" \
            || echo "::warning::canale.yml non lanciato: il puntatore firmato si aggiorna al prossimo giro settimanale (o a mano: gh workflow run canale.yml --ref main)"
