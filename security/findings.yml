    since: v0.40.7
    evidence:
      - file: tools/prove-empiriche/prova-8-le-unit-si-comportano-come-dichiarano.sh
        contains:
          - "systemctl show"
          - "file dice"
          - "controprova dello strumento"
      - file: security/check_findings.py
        contains:
          - "if needle not in text:"
          - "def solo_in_commenti"
          - "PRESIDIO NEI COMMENTI"
    missing: >
      TROVATO DALL'ANALISI ESTERNA del round-7 (27/07/2026), che l'ha formulato
      meglio di come l'avevamo formulato noi:

        «Il registro convalida un'ETICHETTA DI TESTO: cerca la stringa nel file
         sorgente invece di collaudare il comportamento che quella riga dovrebbe
         generare nel sistema operativo. Avere 41 voci dichiarate chiuse basandosi
         sulla lettura del bugiardino crea un falso senso di invulnerabilità.»

      È VERO E VERIFICATO: `check_findings.py` fa `if needle not in text` — un
      match di sottostringa. Il presidio `check_titolo_nomina_file` (26/07) lega
      il TITOLO di una voce al FILE che nomina, e nei propri limiti dichiarava già
      di «non verificare che l'evidenza dica qualcosa di vero». La distanza fra
      quel limite scritto e un'azione è rimasta aperta finché non l'ha nominata
      qualcuno da fuori.

      🔴 IL SUGGERIMENTO NON È STATO PRESO ALLA LETTERA, e la ragione è misurata.
      L'analisi proponeva: «la pipeline esegua `systemctl show vps1777-update` e
      FALLISCA se non restituisce NoNewPrivileges=yes». Applicato così IL TEST
      FALLIREBBE SEMPRE: quella unit NON PUÒ avere `NoNewPrivileges` — usa `sudo`,
      che è setuid, e lo bloccherebbe; sta scritto nella unit stessa alla riga 17.
      Misurato sulla macchina viva: `systemctl show vps1777-update.service -p
      NoNewPrivileges` → `no`. L'analisi ha mescolato due unit proprio nel
      passaggio in cui accusa il registro di guardare l'unit sbagliata.
      ⇒ Preso il MECCANISMO (chiedere al demone), scartato l'ESEMPIO. La prova non
      ha una lista fissa di direttive attese: legge quelle che ogni unit dichiara
      per sé, così una unit che non può avere una direttiva non viene accusata di
      non averla.
      ⚠️ Nota a chi ratifica: questo residuo è stato scritto DOPO che l'esempio
      rotto era già stato accettato come buono in una consegna — la sostanza era
      giusta e l'esempio non era stato verificato. Verificare anche ciò che si
      ratifica è parte del ratificare.

      FATTO: `prova-8`, eseguita sui DUE esiti sulla VPS in produzione (27/07):
      PASS su 23 direttive di 4 unit (dichiarate E applicate), FAIL su un file che
      promette due direttive che il demone non applica. Porta una controprova
      interna — cerca una direttiva NON dichiarata e pretende che il demone
      risponda `no` — perché uno strumento che dicesse «sì» a qualunque domanda
      darebbe un verde perfetto e falso; e quando quella controprova non può
      girare, lo DICHIARA invece di tacere.

      COSA MANCA:
        (a) la prova non gira in CI. Richiede un demone systemd con le unit
            caricate: il runner non le ha. Va eseguita sull'host, e oggi la lancia
            una persona. Finché è così, questo presidio è una buona abitudine con
            un exit code — che è precisamente ciò che questa voce denuncia, un
            piano più in basso.
        (b) verifica che il DICHIARATO sia effettivo, non che il dichiarato sia
            SUFFICIENTE: una direttiva che manca e che sarebbe opportuna non la
            vede nessuno. Quella domanda è di una review, non di una prova.
        (c) copre le unit systemd. Le stesse evidenze «per stringa» esistono per
            i compose e per il codice Python, e lì non c'è un demone a cui chiedere.

      AVANZAMENTO del 27/07 — un pezzo di (b) è stato meccanizzato, e nasce da un
      rilievo di abdd732a: un `contains` su un identificatore è soddisfatto anche se
      quell'identificatore vive SOLO in un commento. Il presidio può essere verde
      mentre il codice che dovrebbe presidiare non c'è più: sta guardando la
      spiegazione, non la cosa. `check_findings.py` ora lo rileva e FALLISCE, a meno
      che l'ago non sia dichiarato sotto `ricevute:` — un'evidenza che promette di
      tenere in vita una RAGIONE, non un comportamento. Misurato su questo registro
      prima di scrivere la regola: 5 aghi su 56 voci stavano solo nei commenti, tutti
      e cinque legittimi come ricevute (H50 ×3, H51 ×1, H56 ×1). Il difetto non era
      che esistessero: era che il registro non distingueva una ricevuta da un presidio,
      e chi leggeva non poteva sapere quale delle due stesse guardando.

      E UNA SECONDA MISURA, che ha ristretto il problema invece di allargarlo: gli aghi
      MISTI — presenti sia nel codice sia in un commento — sono 19 su 56 voci. Sembravano
      la coda del difetto e NON LO SONO: se il codice sparisce restano solo i commenti, e
      a quel punto il controllo qui sopra li prende. Il caso misto è già coperto.

      🔴 QUEL CHE RESTA DAVVERO, ed è più stretto e più cattivo: un ago la cui unica
      occorrenza «in codice» è dentro una STRINGA — un messaggio d'errore, una nota,
      un testo di log — invece che in un'istruzione che fa qualcosa. Là il gate vede
      codice e sta guardando prosa. Trovato e corretto su H2 (`critical`): l'ago era il
      nome nudo `VPS1777_REQUIRE_COSIGN`, e 3 delle 8 occorrenze erano commenti mentre
      altre 2 erano stringhe di messaggio. Ora è ancorato a `get("…", "")`, cioè alla
      LETTURA della variabile: forma che nessun commento scrive e che non capita per
      caso. Controprova: tolta la lettura e lasciate tutte le menzioni → il gate diventa
      rosso, dove prima sarebbe rimasto verde.
      NON meccanizzato: distinguere «dentro una stringa» da «istruzione» richiede di
      leggere l'albero sintattico, e solo per il Python — i compose e gli script di shell
      resterebbero fuori. È scritto qui invece che risolto di corsa.
      📌 Il rilievo è di abdd732a. Il suo conteggio su H2 (6 occorrenze su 8 in commento)
      non combacia col mio (3 su 8, misurate riga per riga e stampate): non l'ho ratificato
      e non l'ho scartato — ho preso il RIMEDIO, che regge indipendentemente dal numero,
      e ho detto la divergenza invece di lasciarla passare.

      MISURATA E NON APPLICATA, la regola più forte: «ogni voce deve avere almeno un
      ancoraggio comportamentale — un `contains` in un file di codice, o un
      `not_contains`». Oggi la violerebbero 3 voci su 56, e tutte e tre per un motivo
      legittimo: H28 è `accepted` e non ha evidenze per costruzione; H44 ha per OGGETTO
      la documentazione (le sue evidenze sono .md perché è lì che vive il fix); H48 usa
      un `not_contains` e nessun `contains`. Applicarla così com'è accuserebbe tre voci
      sane — un presidio che grida al lupo si impara a spegnere. Serve prima un modo di
      dichiarare «questa voce ha per oggetto un documento», e non lo si inventa di corsa
      a fine giornata. Il numero è qui perché la prossima non debba rimisurarlo.

  - id: H53
    severity: medium
    title: "Gate che non potevano fallire: lo step shellcheck in .github/workflows/ci.yml girava con `|| true`, e il lint copriva due percorsi su quattro"
    status: closed
    scoperta:
      quando: "2026-07-27"
      come: misura
      nota: "misurando la copertura dei gate invece di leggerla: shellcheck girava con `|| true`"
    natura: comportamento
    since: v0.40.7
    prova:
      - comando: "mapfile -t SCRIPTS < <(git ls-files '*.sh'); shellcheck (digest pinnato) \"${SCRIPTS[@]}\""
        output: "shellcheck su 17 script — deploy.sh e installer/launch.sh compresi, che non erano MAI stati nel perimetro"
        exit: 0
        quando: "2026-07-27"
      - comando: "shellcheck deploy.sh  (PRIMA del fix, stessa immagine)"
        output: "16 rilievi: 5 SC2027 (warning) + 5 SC2086 sulle virgolette che si annullavano in `sudo -u \"$OPERATOR_USER\"`, 2 SC2015, 2 SC2016, 2 SC2029"
        exit: 1
        quando: "2026-07-27"
      - comando: "bash -n deploy.sh e confronto del comando remoto generato prima/dopo"
        output: "sintassi ok · «sudo -u vps1777 bash -lc '…'» IDENTICO prima e dopo: la correzione toglie una virgoletta di troppo, non cambia ciò che gira sulla macchina"
        exit: 0
        quando: "2026-07-27"
    evidence:
      - file: .github/workflows/ci.yml
        contains:
          - "koalaman/shellcheck@sha256:"
          # l'invariante non è più QUALI percorsi: è che non ci sia un elenco.
          # `git ls-files` non può dimenticare un file — se qualcuno torna a
          # scriverli a mano, questa riga sparisce e il gate diventa rosso.
          - "mapfile -t SCRIPTS < <(git ls-files '*.sh')"
          - "ruff check services/ tools/ security/"
        not_contains:
          - "shellcheck setup.sh tools/*.sh || true"
      - file: tools/backup.sh
        contains: ["if ! week=$(date -d \"$ymd\" +%G-%V 2>/dev/null); then"]
    missing: >
      TROVATO IL 27/07/2026 misurando la copertura reale dei gate, non leggendola.
      Due difetti nello stesso step di CI, e la stessa forma di H51/H52: un presidio
      che gira, dà verde, e NON PUÒ vedere ciò per cui esiste.

        (1) `shellcheck setup.sh tools/*.sh || true` — con quel `|| true` lo step
            era verde per costruzione. Misurato togliendolo: shellcheck usciva 1
            su main, con 7 rilievi, e uno era un BUG VERO nella ritenzione dei
            backup: `week=$(date … || continue)` in tools/backup.sh:146. Il
            `continue` girava dentro la sostituzione di comando — cioè in una
            subshell — e non saltava niente (SC2106). Un file col nome non
            parsabile non veniva scartato: `week` restava vuoto, `weeks[""]`
            veniva occupato, e quel file si prendeva UNO DEI QUATTRO POSTI
            weekly, buttando fuori un backup vero. Presente da quando lo script
            esiste, visibile a shellcheck dal primo giorno, invisibile alla CI
            per sempre. Corretto, e lo step ora fallisce davvero (--severity=warning:
            i 6 rilievi `info` restanti sono stilistici e non bloccano).

        (2) `ruff check services/ tools/vps1777.py` — fuori restavano security/
            (il guardiano del registro, cioè QUESTO controllo), tools/verify-features.py
            e tutta tools/tests/. Esteso a `services/ tools/ security/`: zero
            rilievi. Il non-coperto era anche pulito, ed è il motivo per cui la
            lacuna poteva durare — un buco che non fa male non lascia tracce.

      COSA MANCA:
        (a) CHIUSO lo stesso giorno, guardando invece che di corsa. Il `|| true`
            dello step "Migrations immutability" proteggeva solo la cattura di
            `git diff` — ma se quel diff fosse fallito per un motivo VERO (ref
            sbagliata, fetch incompleto, repo in uno stato strano), `CHANGED`
            sarebbe rimasto vuoto e il gate avrebbe approvato una PR che modifica
            una migrazione già pubblicata. Ora l'esito si cattura e si distingue:
            `set +e` / `RC=$?` / `set -e`, e se `RC != 0` lo step muore dicendo
            «non so dire se le migrazioni siano intatte, e "non lo so" non è
            "vanno bene"». Provata in locale sui TRE esiti: comando fallito →
            rosso (era il falso verde), riuscito e vuoto → verde, riuscito con
            risultati → rosso.
            RESTA la parte onesta: la sweep dei gate incapaci di fallire ha
            coperto i workflow (`|| true`, `continue-on-error`, `allow_failure`).
            Non ha coperto gli script fuori dalla CI, dove lo stesso motivo può
            annidarsi in altre forme — un `2>/dev/null` che nasconde l'errore, un
            `if` senza `else`, un `exit 0` in coda a una funzione.
        (b) restano i gate che falliscono correttamente ma MISURANO la cosa
            sbagliata. Questa voce copre solo quelli che non potevano fallire
            affatto: è la metà facile del problema.
        (c) CHIUSO lo stesso giorno, e con la soglia ABBASSATA invece che alzata.
            Erano 7 e non 6 (il conteggio di prima è del momento in cui
            tools/prove-empiriche/ era ancora fuori dal glob: un numero vero alla
            sua data, che il giorno dopo descriveva un altro insieme). Ora la CI
            gira shellcheck alla soglia MINIMA — nessun `--severity` — e le sette
            eccezioni sono dichiarate nel codice, una per una, col perché accanto:
              · SC2015 in setup.sh: CORRETTO. `cmd && ok "…" || warn "…"` sembra
                un if-then-else e non lo è — se fallisse `ok` partirebbe anche il
                ramo d'errore, e l'installer direbbe insieme «attivo» e «non
                abilitate». Riscritto if/then/else: la forma era la trappola, non
                l'occorrenza.
              · SC2086 in setup.sh: la divisione in parole di $ENABLE_UNITS è VOLUTA
                (è una lista di unit); virgolettarla la romperebbe.
              · SC2028 in prova-3: la `\n` letterale è il punto — quella riga stampa
                un comando da copiare.
              · SC2012 ×4 in backup.sh e restore.sh: i nomi li genera lo script stesso
                (vps1777-${TIMESTAMP}.tar.age), niente spazi né a capo. `find` sarebbe
                più generale e cambierebbe la logica di RITENZIONE DEI BACKUP per un
                rilievo di stile: il rischio sbagliato da correre.
            ⭐ La differenza fra le due strade è tutta qui: una soglia alzata nasconde
            N cose e non dice quali; un'eccezione dichiarata è UNA cosa, con un nome e
            una ragione che il prossimo può contestare.

            🔴 E ABBASSANDO LA SOGLIA LA CI È DIVENTATA ROSSA, per un motivo che non
            era nel codice: `apt-get install shellcheck` dava la 0.9.0 sul runner,
            mentre in locale validavo con la 0.11.0 — e le due versioni danno
            VERDETTI DIVERSI SULLO STESSO CODICE (4 rilievi SC2015 che solo la 0.9.0
            vede, nelle prove empiriche). Verde da una parte, rosso dall'altra, e
            nessuna delle due sbagliava: erano due strumenti diversi con lo stesso
            nome. È il gemello dell'incidente ruff del 26/07 preso dall'altro capo —
            là il gate cambiava contratto da solo, qui lo cambiavo io senza saperlo,
            perché «shellcheck» in locale e «shellcheck» in CI non erano la stessa
            cosa e niente lo diceva.
            FATTO: i 4 `A && B || C` riscritti espliciti (la forma inganna anche
            quando il risultato è giusto), e shellcheck PINNATO PER DIGEST in CI come
            le immagini e le action. Ora le due versioni concordano — verificato
            eseguendo 0.9.0 e 0.11.0 sullo stesso albero, entrambe exit 0 — e le prove
            riscritte sono state RIESEGUITE, incluso il ramo «repo non trovato» che
            deve dare 2 e non un PASS.

  - id: H54
    severity: medium
    title: "Il gateway monta il token del bot Telegram: una compromissione del gateway porta con sé il controllo del bot, che è più di quanto il gateway sia"
    status: partial
    resta_aperto: >
      La decisione A (container mediatore) o B (il bot che il token lo monta già): è un baratto vero su una macchina da 4 GB, e lo decide chi possiede la macchina.
    rilievo_esterno:
      fonte: "analisi esterna del round-7 (audio 59332893)"
      difetto: vero
      rimedio: assente
      inquadramento: piu-largo
      nota: >
        «Cinque segreti Docker in chiaro sul gateway, incluso il token Telegram»: il
        difetto è vero, ma l'inquadramento era PIÙ LARGO del reale. Quattro di quei
        cinque sono credenziali del gateway stesso, e chi prende il gateway le ha già
        per definizione: la superficie aggiuntiva è UNA. «Cinque» risponde a «cosa
        vede», «uno» a «cosa si guadagna a prenderlo». Nessun rimedio proposto.
    scoperta:
      quando: "2026-07-27"
      come: audio-esterno
      nota: "nominata dal round-7 e portata qui da 71d540e6; il numero corretto (uno, non cinque) è nostro"
    # il rischio è nella superficie, non in un comportamento da eseguire
    natura: documento
    since: v0.40.7
    evidence:
      - file: compose.yaml
        contains: ["telegram_bot_token"]
      - file: SECURITY.md
        contains: ["H54"]
    missing: >
      NOMINATO DALL'ANALISI ESTERNA del round-7 come «cinque segreti Docker in chiaro
      sul gateway, incluso il token Telegram, che è la radice di fiducia dell'app», e
      portato qui da 71d540e6 con un rilievo che l'audio non poteva fare: il registro
      aveva H44 `closed` su questo terreno, ma H44 chiude una lacuna DOCUMENTALE («i
      doc dichiarano i secret che il gateway vede»). Chi scorreva il registro cercando
      il rischio residuo sotto `partial` non trovava niente — e il rischio non era
      mitigato, era solo scritto.

      LA CORREZIONE DI MERITO, misurata (compose.yaml, servizio gateway): i segreti
      montati sono cinque — gateway_secret, oauth_signing_secret, admin_password_bcrypt,
      telegram_bot_token, archive_desc_secret. Ma QUATTRO SONO SUOI: firma le proprie
      sessioni, firma l'OAuth, verifica la password admin (di cui tiene l'hash bcrypt,
      non la password), descrive l'archivio. Perderli significa perdere il gateway, che
      in uno scenario di compromissione del gateway è già perso per definizione:
      elencarli come superficie aggiuntiva gonfia il numero senza aggiungere rischio.
      LA SUPERFICIE VERA È UNO SOLO — `telegram_bot_token`. Quel token non serve al
      gateway per essere sé stesso: serve a PARLARE come il bot. Chi lo prende può
      scrivere a nome del bot, leggerne gli aggiornamenti e impersonarlo fuori dal
      perimetro del gateway — cioè ottiene qualcosa che il gateway, di suo, non è.
      «Cinque» è il numero giusto per la domanda «cosa vede»; «uno» è il numero giusto
      per la domanda «cosa si guadagna a prenderlo». L'audio faceva la prima domanda e
      rispondeva come se fosse la seconda.

      COSA MANCA: la mitigazione non è decisa, e non la decide un rilievo. L'opzione
      nota è un mediatore — un processo separato che tiene il token ed espone al gateway
      solo «manda questo messaggio a questo destinatario», così una compromissione del
      gateway permette di mandare messaggi ma non di portarsi via l'identità del bot.
      Costa un container, un canale interno e una superficie nuova da presidiare, su una
      macchina da 4 GB e per un bot mono-utente. È un baratto vero, non un fix ovvio:
      va deciso da chi possiede la macchina, e finché non è deciso questa voce resta
      `partial` — scritta, non risolta, e con lo stato che lo dice.

  - id: H55
    severity: medium
    title: "La telemetria poteva far cadere una riparazione: progress_write/status_write scrivevano nudi, e una PermissionError uccideva `vps1777 update` a metà"
    status: partial
    resta_aperto: >
      La causa a monte: la unit gira come root perché le servono docker e l'installazione del binario. È stato tolto il danno, non l'asimmetria.
    scoperta:
      quando: "2026-07-27"
      come: misura
      nota: "aggiornando davvero la macchina: `vps1777 update` è morto allo step 4"
    natura: comportamento
    since: v0.40.8
    evidence:
      - file: tools/vps1777.py
        contains:
          - "def _scrivi_telemetria"
          - "_TELEMETRIA_MUTA"
          - "RACCONTARE l'aggiornamento, non a farlo"
      - file: tools/tests/test_vps1777.py
        contains:
          - "test_progress_write_il_caso_esatto_della_vps_cartella_ok_file_no"
          - "test_progress_write_avvisa_una_volta_sola_e_non_quindici"
    missing: >
      TROVATO AGGIORNANDO DAVVERO LA MACCHINA, il 27/07/2026 — non leggendo il codice:
      `vps1777 update`, cioè il comando che docs/UPDATE.md consiglia, è morto allo
      step 4 con un traceback Python e `PermissionError` su
      onboarding/update_progress.json.

      IL MECCANISMO: `vps1777-update.service` gira come `User=root`, e ogni giro del
      timer automatico lascia quel file di proprietà di root. Tutto il resto di
      onboarding/ è dell'utente del servizio. Da quel momento il comando manuale —
      lanciato come utente del servizio, che è il modo naturale — non può più
      riscriverlo. Sulla VPS il file era di root dalle 01:57.

      PERCHÉ È UNA CLASSE E NON UN INCIDENTE: `update_progress.json` e
      `update_status.json` sono ciò che i pannelli LEGGONO per disegnare la barra di
      avanzamento e il badge «aggiornamento disponibile». Non servono a fare l'update:
      servono a mostrarlo. Un aggiornamento — cioè una riparazione — è stato abortito
      perché non si riusciva a scrivere il file che lo RACCONTA. Il fail-closed è
      giusto sulla firma del bundle, dove si rifiuta di installare qualcosa di non
      verificato; è sbagliato qui, dove si rifiuta di riparare perché non si riesce a
      raccontarlo.

      FATTO: `_scrivi_telemetria()` avvisa e prosegue invece di sollevare, UNA volta
      per esecuzione (un update ha quindici step: quindici righe identiche seppelliscono
      il resto dell'output proprio quando serve leggerlo). E quando gira da root
      riallinea il file al proprietario della cartella, così il comando manuale
      successivo lo trova scrivibile: si toglie la causa, non solo il sintomo.
      6 test, con la CONTROPROVA fatta sul caso ESATTO della VPS — cartella scrivibile
      e singolo FILE no. I primi due test rendevano non scrivibile la CARTELLA: stessa
      classe, meccanismo diverso, e un fix collaudato solo su quello sarebbe stato
      verde sul caso sbagliato. Verificata anche in negativo (`except OSError` reso
      inefficace → 3 test rossi con PermissionError), e la controprova al primo
      tentativo era invalida — la mutazione lasciava un `except` orfano e il file non
      compilava: un rosso da SyntaxError non prova niente sul fix.

      OSSERVATO IN PRODUZIONE il 27/07 con la v0.40.8, e questo cambia due residui:
        (a) il ramo che riallinea il proprietario NON è esercitato dai test (serve root,
            la suite gira da utente) — MA È STATO VISTO FUNZIONARE SUL VIVO: dopo
            l'aggiornamento `onboarding/update_progress.json` è passato da `root:root` a
            `vps1777:vps1777`. Resta scoperto dai test, non più solo dalla lettura: una
            osservazione singola in produzione non è una prova ripetibile, ed è la
            differenza fra «l'ho visto» e «non può regredire in silenzio».
        (b) RISOLTO: `vps1777 check` lanciato come utente del servizio sulla macchina
            esce 0. Era il comando che moriva con un traceback.

      COSA MANCA:
        (c) la causa a monte — la unit gira come root perché le serve docker e
            l'installazione del binario — non è toccata. Qui si è tolto il danno,
            non l'asimmetria.

