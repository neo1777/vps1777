    missing: >
      IL FATTO: `security/findings.yml` e `tools/vps1777.py` contenevano un indirizzo IPv4
      pubblico, in `main` e nei tag v0.40.8, v0.40.9, v0.40.10 di un repo PUBBLICO, dalle
      12:54 del 27/07 alla sera. Tolto da entrambi.

      ⚖️ LA SEVERITÀ, e la metto BASSA con il ragionamento scritto perché sono io
      l'autrice del commit e gonfiare il proprio errore è l'altra faccia del minimizzarlo
      — contestatela se non regge. Quell'indirizzo NON è la macchina di Neo e NON è il suo
      tailnet: è un ingresso PUBBLICO e CONDIVISO di Tailscale, e lo dice il testo stesso
      in cui era scritto. Non dà accesso a niente, non identifica la rete di nessuno, e
      che il servizio stia dietro un Funnel il repo lo dichiara ovunque per disegno. La
      prima formulazione del rilievo diceva «l'indirizzo a cui risponde il servizio»: vero
      alla lettera, ma invita a leggere «l'indirizzo del servizio», che è un'altra cosa.
      Decisione di Neo, 27/07: resta nella storia, «di monito ai posteri» — riscrivere la
      storia di un repo pubblico ha un costo e il dato non lo giustifica. Lo stato onesto
      da scrivere è «non più in vista», non «rimosso».

      ⭐ IL DIFETTO VERO NON È L'INDIRIZZO: è che la regola esisteva, era scritta, e
      nessun presidio la applicava. «Nessun indirizzo, hostname o URL della macchina, in
      nessuna forma» la applicavamo ai corpus a mano; il prodotto no. E la stessa CLASSE
      era già stata trovata al round-6 (un hostname in `.env.example` e in un test, tolto
      in 3b3b4b2): il rimedio di allora tolse il valore e non costruì il presidio, quindi
      cinque settimane dopo la classe è tornata in un'altra forma.

      ⚠️ E LA FORMA DI COME CI È ENTRATO merita più del caso: documentando la PROVA di una
      misura ci è finito dentro l'ENDPOINT della misura. Il commit è quello che implementa
      ciò che un audit aveva chiesto. Il rimedio raccomandato da una revisione ha
      introdotto l'esposizione, e la prova che lo documentava era il veicolo. 📌 Nota di
      merito: l'indirizzo non serviva all'argomento — la nota dimostrava «risolve a un
      ingresso PUBBLICO, non al tailnet», che è una CATEGORIA. Il dato sfuggito era
      decorazione, ed è il caso tipico: si redige ciò che si crede sensibile, non ciò che
      è superfluo.

      IL RIMEDIO — R3 in `security/check_no_leaks.py`: indirizzi IPv4 pubblici e nomi di
      tailnet reali fanno fallire la build. Con le esclusioni giuste, che sono metà del
      lavoro: reti private, loopback, link-local, multicast, gli indirizzi RFC 5737 nati
      apposta per la documentazione, e un elenco di bersagli di test dichiarati UNO PER
      UNO COL PERCHÉ.

      🔴 TRE COSE CHE IL PRESIDIO HA TROVATO SU SÉ STESSO, e sono il valore di averlo
      provato invece di averlo scritto:
      (a) al primo giro è diventato rosso su `installer/ui.html`, dove il campo «IP
      pubblico» aveva come segnaposto un indirizzo pubblico VERO. Sostituito con 203.0.113
      (RFC 5737). Non lo cercava nessuno.
      (b) la regex dei nomi tailnet non combaciava MAI: il `\b` era finito in una stringa
      non-raw, quindi cercava un carattere di backspace. Sempre verde per costruzione —
      la stessa classe che quel file esiste per impedire. L'ha trovata il test al primo
      giro, e solo perché fra i casi ce n'era uno che DOVEVA diventare rosso.
      (c) scrivendo il test ho riscritto l'indirizzo vero DENTRO il file che esiste per
      impedirlo, sotto un commento che diceva «non è scritto qui». E il gate ha detto
      verde, perché scansionava solo i file già TRACCIATI e quello era nuovo. Corretti
      entrambi: l'indirizzo tolto, e il gate ora guarda anche ciò che sta per essere
      aggiunto. ⭐ Un presidio che non vede ciò che stai per aggiungere vede solo i tuoi
      errori passati.

      📌 E UNA DISTINZIONE CHE VALE OLTRE QUESTO FILE: l'allowlist era per FILE, quindi
      esentava da OGNI regola. `security/findings.yml` era esente perché cita i pattern
      dei segreti — e per quella ragione non veniva scansionato affatto, che è il motivo
      per cui l'indirizzo ci è vissuto dentro. Ora l'esenzione è per REGOLA: quel file
      resta esente da R2 e NON da R3. Un'esenzione concessa per una ragione non deve
      estendersi a tutte le ragioni.

      CHIUSA il 27/07 con la v0.40.11: il presidio gira in CI su una release, è stato
      visto rosso su DUE casi reali e non costruiti (il segnaposto dell'installer e
      un'esca in un file nuovo), ed è provato su 11 casi a risposta nota.
      ⚠️ MA «chiuso» qui vuol dire IL PRESIDIO, non il dato: l'indirizzo resta nella storia
      di git e nei tre tag, per decisione datata di Neo («di monito ai posteri»). Lo stato
      onesto dell'esposizione è «non più in vista», non «rimosso» — ed è scritto anche in
      SECURITY.md perché nessuno legga il verde come una cancellazione.
      ⚠️ RESIDUO DICHIARATO, e va guardato con gli occhi: `security/check_no_leaks.py` e
      `tools/tests/test_no_leaks.py` sono esenti da R3, perché gli indirizzi li contengono
      per mestiere. Sono i due soli posti in cui un indirizzo vero potrebbe nascondersi
      senza che nessuno lo veda. Sono due e sono corti — un'esenzione che non si può
      rileggere a mano sarebbe troppo larga.

  - id: H61
    severity: low
    title: "Il presidio nato da H59 confondeva «cartella illeggibile» con «zero backup», e avrebbe gridato «i tuoi backup sono spariti» per un problema di permessi"
    status: closed
    scoperta:
      quando: "2026-07-27"
      come: lettura
      nota: >
        abdd732a, leggendo `copertura_backup()` lo stesso giorno in cui è nata — e
        cercando LA SECONDA RIGA e non solo la prima, che è la guardia che si era data
        dopo essersi fermata alla prima al mattino. Riprodotta da b82df434 su tre casi
        prima di correggerla: leggibile → (2, date), ILLEGGIBILE → (0, None, None),
        assente → (0, None, None). Tre stati, due valori.
    natura: comportamento
    since: v0.40.12
    prova:
      - comando: "ssh <vps> runuser -u <utente-servizio> -- python3 <tri-stato sul codice INSTALLATO, cartella finta>  # v0.40.12"
        output: "leggibile → (2, '2026-07-26', '2026-07-27') · ILLEGGIBILE → (None, None, None) · allarme-perdita armato? NO · massimo storico intatto? True · cecità dichiarata? True"
        exit: 0
        quando: "2026-07-27"
      - comando: "lo stesso script eseguito come ROOT sulla stessa macchina"
        output: "ILLEGGIBILE → (2, ...) — root ignora i permessi: NON riproduce la condizione, e infatti la prima stesura di questa prova non provava niente"
        exit: 0
        quando: "2026-07-27"
      - comando: "python3 tools/tests/test_vps1777.py"
        output: "4 casi nuovi verdi: illeggibile≠zero · assente=zero · il rientro pulisce la cecità · il massimo storico non si muove sul non-misurato"
        exit: 0
        quando: "2026-07-27"
    evidence:
      - file: tools/vps1777.py
        contains:
          - "return None, None, None"
          - "copertura backup: NON MISURATA"
      - file: tools/tests/test_vps1777.py
        contains:
          - "def test_cartella_illeggibile_NON_e_zero_giorni():"
    missing: >
      IL FATTO: `Path.glob` su una cartella senza permessi NON solleva — restituisce
      vuoto. «Zero file» e «zero permessi» collassavano nello stesso valore, e
      `_sorveglia_copertura_backup` leggeva quel collasso come una regressione: notifica
      «🔴 la finestra di ripristino si è accorciata. Copertura: 0 giorni». Il messaggio
      più allarmante che quel presidio sappia produrre, per un dato che non aveva.

      ⚠️ E IL PRECEDENTE SU QUESTA MACCHINA NON È TEORICO: è H55, un `PermissionError`
      per lo stesso identico pattern root-contro-utente, che la mattina del 27/07 ha
      ucciso un update vero. La condizione oggi non si verifica — verificato sulla VPS
      prima di scrivere: `backups/` è dell'utente del servizio e la unit gira come root,
      quindi legge — ma «oggi non capita» non è «non può capitare».

      ⭐ IL RILIEVO CADE ESATTAMENTE SUL CRITERIO CHE IL PRESIDIO SI ERA DATO. La sua
      stessa docstring argomenta che si notifica una REGRESSIONE e non una finestra non
      ancora piena, perché «un allarme che suona quando va tutto bene viene silenziato
      prima di servire davvero». Un allarme che grida «i tuoi backup non ci sono più»
      per un problema di permessi brucia la fiducia nel presidio PRIMA della volta in cui
      è vero — cioè fa il danno che quella riga esiste per evitare, per un'altra strada.

      📌 PERCHÉ UNA VOCE NUOVA E NON UN EMENDAMENTO A H59: H59 è chiuso e il suo rimedio
      è in produzione. Questo è un difetto DEL rimedio, trovato dopo. Riscrivere H59
      farebbe sparire dal registro il fatto che il presidio è nato con questo buco — ed è
      la stessa ragione per cui H56 è una voce e non una riga aggiunta a H14.

      IL RIMEDIO: tri-stato. `None` = NON MISURATO (cartella illeggibile), `0` = misurato
      e vuoto (cartella assente o senza backup), `N` = N giorni. Sul non-misurato il
      presidio NON tocca il massimo storico, NON arma l'allarme sulla copertura, e segna
      una CECITÀ separata — con la sua notifica gialla e la sua transizione, perché un
      presidio che non può vedere è esso stesso una cosa da sapere. Una domanda senza
      risposta non è una risposta cattiva.

      CHIUSA il 27/07 con la v0.40.12 in produzione e la prova eseguita sulla macchina.

      🔴 E LA PRIMA STESURA DI QUELLA PROVA NON PROVAVA NIENTE — quinta controprova rotta
      della giornata, sempre per lo stesso motivo. Girava come ROOT, e root ignora i
      permessi: `chmod 000` non impediva la lettura, quindi il caso «illeggibile» tornava
      (2, date) come il caso leggibile. Rifatta con `runuser` verso l'utente del servizio,
      e lì la condizione si riproduce. ⭐ La forma, di nuovo: verificavo l'oggetto vicino a
      quello che conta — e stavolta l'oggetto sbagliato era il PRIVILEGIO con cui misuravo.

      ⭐ E IL CONFRONTO FRA I DUE RUN DICE UNA COSA CHE VALE PIÙ DELLA CHIUSURA: la
      condizione di H61 oggi NON PUÒ accadere su questa macchina, perché la unit gira come
      root — che è esattamente il residuo dichiarato in H55, ancora aperto. Un residuo ne
      maschera un altro: finché il primo resta, il secondo è invisibile; il giorno in cui
      H55 verrà curato facendo girare la unit senza privilegi, H61 diventerebbe
      raggiungibile. È stato curato PRIMA di quel giorno, ed è l'unica ragione per cui la
      sequenza non produce un guasto.

