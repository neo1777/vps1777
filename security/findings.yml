    missing: >
      DUE COSE, trovate insieme perché nascono dalla stessa misura: un backup di questa
      macchina pesa 2,58 GB, e lo snapshot pre-update ~2,4 GB.

      ① IL FILE TRONCATO CHE SEMBRA UN BACKUP. `tar … | age -o "$OUT"` scrive
      direttamente sul nome finale. Se la scrittura si interrompe — disco pieno, OOM, un
      kill — resta sul disco un `.tar.age` col nome giusto e il contenuto a metà. La
      ritenzione lo conta come il backup di quel giorno, il conteggio torna, e nella
      finestra di ripristino c'è un file che non si apre. Un backup rotto che occupa il
      posto di uno buono è peggio di un backup mancante, perché il conteggio non lo
      distingue e nessuno va a guardare. RIMEDIO: il nome resta segnato come incompleto
      finché la scrittura non è finita, e il trap lo rimuove se lo script muore prima.
      ⚠️ RESIDUO DICHIARATO: il trap non copre un `kill -9` né un crash del kernel. Il
      file troncato resterebbe. Curarlo davvero vuol dire scrivere su un nome temporaneo
      e rinominare alla fine — la rinomina è atomica, l'interruzione non lascia mai un
      nome valido. Non l'ho fatto in questo giro: cambia il percorso di scrittura di uno
      script di backup, e volevo che il cambiamento della ritenzione andasse in produzione
      da solo, misurabile.

      ② LA GUARDIA COSTANTE SU UN BERSAGLIO MOBILE. Prima dell'update, `cmd_update`
      chiedeva 5 GiB liberi fissi. Le due operazioni che quella guardia protegge —
      `backup.sh` (2,58 GB) e `snapshot_create` (~2,4 GB) — ne consumano ~5,0 GB: la
      soglia era pari al costo dell'operazione, cioè autorizzava esattamente l'update che
      non ci sta, lasciando ~0,4 GB durante l'esecuzione.
      ⭐ MA IL DIFETTO VERO NON È CHE 5 SIANO POCHI — è che 5 era una COSTANTE misurata
      contro un dato che CRESCE. L'archivio raddoppia e la soglia no: il giorno in cui un
      backup pesa 4 GB, la guardia dice sì a un update che ne consuma 9. Una guardia
      costante su un bersaglio mobile non invecchia male, invecchia in silenzio, e sembra
      verde fino al giorno in cui non lo è. RIMEDIO: la soglia si stima dal backup più
      grande presente sul disco (due oggetti della taglia dei dati + 1 GiB di margine),
      col vecchio 5 GiB tenuto come pavimento assoluto. Sulla macchina di oggi passa da
      5,0 a 5,8 GiB, e cresce da sola con l'archivio.
      E `backup.sh` non aveva NESSUNA guardia di spazio: ora stima dal backup precedente
      — quello di ieri contiene gli stessi volumi, quindi è la miglior previsione di oggi
      — e se non ci sta rifiuta di scrivere invece di fallire a metà. Al primo giro non
      c'è nulla da cui stimare e lo dichiara, invece di inventare una soglia.

      NON È UN RILIEVO NUOVO SULLO SNAPSHOT: che `snapshot_prune` poti per ETÀ (>72h) e
      non per numero è GIÀ SCRITTO in H56, misurato da abdd732a, e resta di sua
      competenza. Verificato prima di scrivere questa voce, per non ripresentare come
      scoperta una cosa che il registro dichiara — è esattamente ciò che rimproveriamo
      agli audio esterni quando drammatizzano un limite dichiarato.
      📌 Cercato anche il contrario prima di dire «non c'era»: zero occorrenze di «spazio
      disco» nel registro, tre di «disco» e nessuna sulla guardia dell'update.

      COSA MANCA per `closed`, ed è UNA cosa sola e dichiarata: la scrittura del backup
      NON è atomica. Il trap copre l'interruzione ordinata, non un `kill -9` né un crash
      del kernel — lì il file troncato resterebbe. La cura vera è scrivere su un nome
      provvisorio e rinominare alla fine, perché la rinomina è atomica e un'interruzione
      non lascia mai un nome valido. Non fatto in questo giro apposta: cambia il percorso
      di scrittura di uno script di backup, e volevo che la modifica della RITENZIONE
      andasse in produzione da sola e misurabile. Due cambiamenti insieme su questo file
      avrebbero reso illeggibile quale dei due ha prodotto quale effetto.
      Il resto è in produzione dal 27/07 (v0.40.10) e misurato: la soglia sulla macchina
      vale 5,81 GiB contro i 5,00 della vecchia costante, e cresce da sola con l'archivio.

