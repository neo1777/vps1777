          - "test_raggiungibilita_ritorno_misura_la_durata_fra_i_due_istanti"
          - "test_funnel_non_e_nel_cancello_dell_update"
          - "test_funnel_giu_e_un_rosso_dopo_piu_di_un_tentativo"
    missing: >
      MISURATO sul vivo, come incidente vero e non come ipotesi (27/07/2026,
      durata misurata 1h27m50s di irraggiungibilità pubblica del servizio).

      GLI ESTREMI, perché una durata senza i suoi due istanti è un aggettivo:
        inizio  2026-07-27T05:56:13Z — l'update ricrea i container; il gateway
                nasce senza porta pubblicata. [istante misurato su archive-mcp e
                nb1777-mcp con `docker inspect .Created`; per il gateway è
                un'INFERENZA FORTE — quel container non esiste più, ma è stato
                creato dallo stesso `compose up`]
        fine    2026-07-27T07:24:03Z — il gateway riparte con la rete `funnel`
                e la porta torna pubblicata. [misurato: `.State.StartedAt`]
      ⚠️ La macchina è su fuso US/Eastern (EDT, -0400) mentre il proprietario
      legge in CEST (+0200): sei ore di scarto. Il journal dice «01:51:55» per
      un evento che per lui sono le 07:51:55. Un log letto senza questa riga
      sposta ogni evento di sei ore, e la cronologia diventa un'altra storia.

      🔴 CORREZIONE DI UNA MIA MISURA, scritta qui perché è dello stesso tipo
      che questa voce denuncia: le prime stesure dicevano «1h40m». Non l'avevo
      misurato — l'avevo dedotto dall'ora di partenza dell'update (07:51) e
      dall'ora in cui stavo scrivendo, cioè da due istanti che non sono gli
      estremi del guasto. Dodici minuti in eccesso, dentro il documento che
      accusa i numeri senza misura. Corretto sugli istanti reali.

      IL DIFETTO: lo healthcheck del gateway esegue, DENTRO il container, una
      richiesta a http://127.0.0.1:8080/health. Sul loopback interno la porta
      risponde SEMPRE — anche quando dall'esterno non è pubblicata affatto.
      `healthy` non significa «raggiungibile»: significa «il processo parla con
      sé stesso». L'health-gate dell'auto-update usa lo stesso segnale, quindi
      la CATENA DI ROLLBACK AUTOMATICO eredita la stessa cecità.

      COSA È SUCCESSO, e perché è una classe e non un incidente: il fix di H50
      ha lasciato il gateway solo su `backend` (`internal: true`), e da una rete
      internal una porta NON SI PUÒ PUBBLICARE — docker accetta `ports:` e non
      la applica, in silenzio. Durante tutto il guasto:
        · il container risultava `healthy`                     → nessun allarme
        · `docker compose config` mostrava il port mapping     → nessun allarme
        · l'health-gate ha dato OK e NON ha fatto rollback     → nessun allarme
      Tre verdi indipendenti su un servizio giù. Il guasto l'ha visto una
      persona aprendo l'URL. Un presidio che non può osservare il guasto che
      dovrebbe osservare non tace: DÀ VERDE, ed è peggio del silenzio.

      COSA È GIÀ FATTO (perché `partial` e non `open`): esiste la prova-7, che
      misura dall'HOST — fuori dal container — che la porta sia pubblicata E che
      risponda, e distingue «non applicabile» (profilo con proxy in container)
      da PASS, uscendo 2 e mai 0. Provata sui DUE esiti prima di essere
      dichiarata: PASS sul gateway reale, FAIL su un container deliberatamente
      privo di porta pubblicata (exit 1). Limite noto: il ramo che segnala
      «il container è `healthy` lo stesso» non è stato esercitato — il container
      di controprova non aveva healthcheck.

      (a) CHIUSO — l'health-gate ora guarda anche da fuori. `health_gate()`
      chiama `porta_esterna_ok()`, che dall'HOST verifica che la porta sia
      pubblicata e risponda 200; se non lo è, il gate diventa rosso e la catena
      di rollback automatico riparte. La logica di verdetto è isolata in
      `valuta_porta_esterna()` — pura, quindi provabile su tutti i rami senza
      un docker vivo: 7 test, incluso quello che riproduce lo stato esatto
      dell'incidente (nessuna porta, nessun proxy → rosso, col motivo scritto)
      e uno che verifica che la chiamata sia davvero CABLATA in `health_gate`,
      perché test verdi su codice scollegato sono l'esca di questa stessa
      classe. Regola scritta dentro: si fallisce solo con EVIDENZA POSITIVA del
      guasto — «non ho misurato» non è «è rotto», perché qui un falso rosso
      costa un rollback non necessario; e con caddy/cloudflared la sonda si
      dichiara non applicabile invece di accusare. Provata anche sul vivo
      (27/07, sulla VPS in produzione): VERDE, col comando compose reale e i
      suoi overlay — nessun falso rosso in agguato al prossimo aggiornamento.

      (b) CHIUSO (27/07, stessa giornata) — la porta è guardata da fuori anche QUANDO
      NON SI AGGIORNA. `_sorveglia_raggiungibilita()` gira dentro `vps1777 check`, che
      il timer lancia ogni giorno con la notifica attiva: nessuna unit nuova da
      installare, ricordare e dimenticare. È chiamata PRIMA del fetch delle release,
      e l'ordine è presidiato da un test — il giorno in cui la macchina sta peggio è
      anche quello in cui GitHub può risultare irraggiungibile, e da lì `cmd_check`
      esce subito: una sonda messa dopo non verrebbe mai eseguita proprio quando serve.
      Notifica le TRANSIZIONI e non lo stato: la caduta quando avviene (una volta sola,
      l'istante non si sposta), il ritorno con la DURATA misurata fra i due istanti —
      cioè esattamente il numero che il 27/07 nessuno aveva e che infatti abbiamo
      dedotto sbagliando di dodici minuti. Un avviso che si ripete ogni giorno uguale
      si impara a ignorare; uno che non si spegne mai non è un avviso.
      6 test, incluso quello che verifica l'ordine e quello che pretende SILENZIO
      quando la sonda non ha potuto misurare (regola invariata: si grida solo con
      evidenza positiva del guasto — un falso rosso qui sveglia una persona per niente,
      e la volta dopo non la sveglia più).
      LIMITE: la cadenza è giornaliera. Restringe la finestra cieca, non la chiude.

      (c) CHIUSO (27/07, stessa giornata) — `funnel_ok()` ESCE dal server e rientra da
      Internet. Con la porta viva e il tunnel giù, per chi apre l'indirizzo il servizio
      è giù e la sonda sull'host direbbe «tutto bene»: è il buco che restava.
      🔴 L'AVEVO DATO PER IMPOSSIBILE, e l'ho misurato invece di assumerlo: credevo che
      dalla macchina il nome pubblico risolvesse all'indirizzo del tailnet, facendo un
      giro su sé stesso. FALSO — risolve a indirizzi PUBBLICI dell'ingresso Tailscale.
      Misura del 27/07 dalla VPS: 200 da 209.177.145.192 in 360 ms sul nome pubblico,
      contro 000 sull'indirizzo di tailnet. La richiesta esce davvero: la sonda è una
      sonda, non un'eco. (Se non l'avessi misurato avrei scritto «non fattibile dalla
      macchina» — un limite dedotto, cioè la stessa classe di errore della durata
      dedotta di stamattina.)
      Collaudata sui TRE rami sulla macchina in produzione: PASS sul Funnel vero,
      FAIL su un nome inesistente, «non applicabile» quando il profilo non usa Funnel.
      Due tentativi con pausa: un singolo errore di rete verso Internet è comune, e un
      falso allarme che arriva due volte a vuoto smette di essere letto.
      ⚠️ NON è nell'health-gate dell'update, ed è una scelta con un test che la tiene
      ferma: quel cancello giudica ciò che l'update PUÒ rompere, e un update non tocca
      il tunnel — un suo singhiozzo farebbe tornare indietro una versione sana. Nella
      sorveglianza giornaliera invece un falso allarme costa una notifica, non un
      rollback: lì la soglia può essere più bassa perché il prezzo dell'errore è più
      basso. Stesso fatto, due presìdi, due soglie diverse, e il perché è scritto.

      (d) CHIUSO (27/07, stessa giornata) — `tools/prove-empiriche/` entra nel pacchetto
      di rilascio (`cp -r tools/prove-empiriche bundle/tools/` in release.yml, e `copy2`
      lato updater conserva i permessi: arrivano eseguibili). Sono l'unico strumento che
      misura sul SISTEMA VIVO ciò che gli altri gate verificano leggendo file, e finora
      restavano nel repo di sviluppo: sulla macchina andavano copiate a mano, quindi non
      c'erano. Un presidio che per essere usato richiede un gesto manuale, nel giorno del
      guasto non esiste. 72 KB di shell senza dipendenze: il costo non era l'argomento.
      Un test lo tiene: se qualcuno toglie la riga, la build lo dice.
      ⚠️ LIMITE del test, dichiarato: legge una STRINGA nel workflow, non costruisce il
      pacchetto. È la classe che H52 denuncia, applicata a sé stessa — prende «qualcuno
      ha tolto la riga», non «il tar è arrivato completo».
      📌 La stessa assenza aveva due facce: le prove erano fuori dal bundle E fuori dal
      corpus dell'audio (rilievo di 71d540e6 nel piano del round-8). Un file che non esce
      di casa in nessuna delle due direzioni finisce per non esistere per nessuno tranne
      chi l'ha scritto.

      NESSUN RESIDUO APERTO su questa voce: resta `partial` finché il pacchetto con le
      prove non è RILASCIATO e installato — la 0.40.7 in produzione non le ha ancora.
      Resta `partial` finché il pacchetto con le prove non è in produzione: la classe è presidiata dove faceva
      male, non ovunque — e la differenza è scritta invece che taciuta.

  - id: H52
    severity: medium
    title: "Le garanzie di hardening sono certificate per STRINGA, non per comportamento: il gate cerca il testo nel file, non chiede al sistema che cosa applica"
    status: partial
    # Era `v0.40.7`: una versione mai rilasciata, assente dal CHANGELOG e dai tag,
    # scritta il 27/07 ancorando la voce alla release SUCCESSIVA come se fosse già
    # uscita. Nessuno se n'è accorto perché `since` era l'unico campo del registro
    # che nessun controllo leggeva — in un file che esiste per rendere falsificabili
    # i claim. Ora check_findings.py lo verifica contro il CHANGELOG, e `unreleased`
    # è il valore vero finché la release non c'è: viene contato e stampato a ogni giro.
    since: v0.40.7
    evidence:
      - file: tools/prove-empiriche/prova-8-le-unit-si-comportano-come-dichiarano.sh
        contains:
          - "systemctl show"
          - "file dice"
          - "controprova dello strumento"
      - file: security/check_findings.py
        contains: ["if needle not in text:"]
    missing: >
      TROVATO DALL'ANALISI ESTERNA del round-7 (27/07/2026), che l'ha formulato
      meglio di come l'avevamo formulato noi:

        «Il registro convalida un'ETICHETTA DI TESTO: cerca la stringa nel file
         sorgente invece di collaudare il comportamento che quella riga dovrebbe
         generare nel sistema operativo. Avere 41 voci dichiarate chiuse basandosi
         sulla lettura del bugiardino crea un falso senso di invulnerabilità.»

      È VERO E VERIFICATO: `check_findings.py` fa `if needle not in text` — un
      match di sottostringa. Il presidio `check_titolo_nomina_file` (26/07) lega
      il TITOLO di una voce al FILE che nomina, e nei propri limiti dichiarava già
      di «non verificare che l'evidenza dica qualcosa di vero». La distanza fra
      quel limite scritto e un'azione è rimasta aperta finché non l'ha nominata
      qualcuno da fuori.

      🔴 IL SUGGERIMENTO NON È STATO PRESO ALLA LETTERA, e la ragione è misurata.
      L'analisi proponeva: «la pipeline esegua `systemctl show vps1777-update` e
      FALLISCA se non restituisce NoNewPrivileges=yes». Applicato così IL TEST
      FALLIREBBE SEMPRE: quella unit NON PUÒ avere `NoNewPrivileges` — usa `sudo`,
      che è setuid, e lo bloccherebbe; sta scritto nella unit stessa alla riga 17.
      Misurato sulla macchina viva: `systemctl show vps1777-update.service -p
      NoNewPrivileges` → `no`. L'analisi ha mescolato due unit proprio nel
      passaggio in cui accusa il registro di guardare l'unit sbagliata.
      ⇒ Preso il MECCANISMO (chiedere al demone), scartato l'ESEMPIO. La prova non
      ha una lista fissa di direttive attese: legge quelle che ogni unit dichiara
      per sé, così una unit che non può avere una direttiva non viene accusata di
      non averla.
      ⚠️ Nota a chi ratifica: questo residuo è stato scritto DOPO che l'esempio
      rotto era già stato accettato come buono in una consegna — la sostanza era
      giusta e l'esempio non era stato verificato. Verificare anche ciò che si
      ratifica è parte del ratificare.

      FATTO: `prova-8`, eseguita sui DUE esiti sulla VPS in produzione (27/07):
      PASS su 23 direttive di 4 unit (dichiarate E applicate), FAIL su un file che
      promette due direttive che il demone non applica. Porta una controprova
      interna — cerca una direttiva NON dichiarata e pretende che il demone
      risponda `no` — perché uno strumento che dicesse «sì» a qualunque domanda
      darebbe un verde perfetto e falso; e quando quella controprova non può
      girare, lo DICHIARA invece di tacere.

      COSA MANCA:
        (a) la prova non gira in CI. Richiede un demone systemd con le unit
            caricate: il runner non le ha. Va eseguita sull'host, e oggi la lancia
            una persona. Finché è così, questo presidio è una buona abitudine con
            un exit code — che è precisamente ciò che questa voce denuncia, un
            piano più in basso.
        (b) verifica che il DICHIARATO sia effettivo, non che il dichiarato sia
            SUFFICIENTE: una direttiva che manca e che sarebbe opportuna non la
            vede nessuno. Quella domanda è di una review, non di una prova.
        (c) copre le unit systemd. Le stesse evidenze «per stringa» esistono per
            i compose e per il codice Python, e lì non c'è un demone a cui chiedere.

  - id: H53
    severity: medium
    title: "Gate che non potevano fallire: lo step shellcheck in .github/workflows/ci.yml girava con `|| true`, e il lint copriva due percorsi su quattro"
    status: partial
    since: v0.40.7
    evidence:
      - file: .github/workflows/ci.yml
        contains:
          - "shellcheck --severity=warning setup.sh tools/*.sh tools/prove-empiriche/*.sh"
          - "ruff check services/ tools/ security/"
        not_contains:
          - "shellcheck setup.sh tools/*.sh || true"
      - file: tools/backup.sh
        contains: ["if ! week=$(date -d \"$ymd\" +%G-%V 2>/dev/null); then"]
    missing: >
      TROVATO IL 27/07/2026 misurando la copertura reale dei gate, non leggendola.
      Due difetti nello stesso step di CI, e la stessa forma di H51/H52: un presidio
      che gira, dà verde, e NON PUÒ vedere ciò per cui esiste.

        (1) `shellcheck setup.sh tools/*.sh || true` — con quel `|| true` lo step
            era verde per costruzione. Misurato togliendolo: shellcheck usciva 1
            su main, con 7 rilievi, e uno era un BUG VERO nella ritenzione dei
            backup: `week=$(date … || continue)` in tools/backup.sh:146. Il
            `continue` girava dentro la sostituzione di comando — cioè in una
            subshell — e non saltava niente (SC2106). Un file col nome non
            parsabile non veniva scartato: `week` restava vuoto, `weeks[""]`
            veniva occupato, e quel file si prendeva UNO DEI QUATTRO POSTI
            weekly, buttando fuori un backup vero. Presente da quando lo script
            esiste, visibile a shellcheck dal primo giorno, invisibile alla CI
            per sempre. Corretto, e lo step ora fallisce davvero (--severity=warning:
            i 6 rilievi `info` restanti sono stilistici e non bloccano).

        (2) `ruff check services/ tools/vps1777.py` — fuori restavano security/
            (il guardiano del registro, cioè QUESTO controllo), tools/verify-features.py
            e tutta tools/tests/. Esteso a `services/ tools/ security/`: zero
            rilievi. Il non-coperto era anche pulito, ed è il motivo per cui la
            lacuna poteva durare — un buco che non fa male non lascia tracce.

      COSA MANCA:
        (a) la sweep non è esaustiva. Ho cercato `|| true`, `continue-on-error` e
            `allow_failure` nei workflow: l'unico altro `|| true` (ci.yml, step
            "Migrations immutability") è legittimo — protegge solo la cattura di
            `git diff`, e il verdetto è un `exit 1` esplicito dopo. MA ha un suo
            falso-verde residuo: se quel `git diff` fallisse per un motivo vero
            (ref sbagliata, fetch incompleto), `CHANGED` resterebbe vuoto e il
            gate passerebbe verde su una PR che modifica una migrazione. Non
            corretto qui: è un altro gesto, e va fatto guardando, non di corsa.
        (b) restano i gate che falliscono correttamente ma MISURANO la cosa
            sbagliata. Questa voce copre solo quelli che non potevano fallire
            affatto: è la metà facile del problema.
        (c) i 6 rilievi `info` di shellcheck (SC2012 `ls | wc -l`, SC2015) sono
            noti e non corretti: cambiare quelle righe in tools/backup.sh e
            tools/restore.sh tocca la logica di ritenzione e di ripristino, e va
            fatto con una prova che li esegua, non con una sostituzione a vista.

  - id: H54
    severity: medium
    title: "Il gateway monta il token del bot Telegram: una compromissione del gateway porta con sé il controllo del bot, che è più di quanto il gateway sia"
    status: partial
    since: v0.40.7
    evidence:
      - file: compose.yaml
        contains: ["telegram_bot_token"]
      - file: SECURITY.md
        contains: ["H54"]
    missing: >
      NOMINATO DALL'ANALISI ESTERNA del round-7 come «cinque segreti Docker in chiaro
      sul gateway, incluso il token Telegram, che è la radice di fiducia dell'app», e
      portato qui da 71d540e6 con un rilievo che l'audio non poteva fare: il registro
      aveva H44 `closed` su questo terreno, ma H44 chiude una lacuna DOCUMENTALE («i
      doc dichiarano i secret che il gateway vede»). Chi scorreva il registro cercando
      il rischio residuo sotto `partial` non trovava niente — e il rischio non era
      mitigato, era solo scritto.

      LA CORREZIONE DI MERITO, misurata (compose.yaml, servizio gateway): i segreti
      montati sono cinque — gateway_secret, oauth_signing_secret, admin_password_bcrypt,
      telegram_bot_token, archive_desc_secret. Ma QUATTRO SONO SUOI: firma le proprie
      sessioni, firma l'OAuth, verifica la password admin (di cui tiene l'hash bcrypt,
      non la password), descrive l'archivio. Perderli significa perdere il gateway, che
      in uno scenario di compromissione del gateway è già perso per definizione:
      elencarli come superficie aggiuntiva gonfia il numero senza aggiungere rischio.
      LA SUPERFICIE VERA È UNO SOLO — `telegram_bot_token`. Quel token non serve al
      gateway per essere sé stesso: serve a PARLARE come il bot. Chi lo prende può
      scrivere a nome del bot, leggerne gli aggiornamenti e impersonarlo fuori dal
      perimetro del gateway — cioè ottiene qualcosa che il gateway, di suo, non è.
      «Cinque» è il numero giusto per la domanda «cosa vede»; «uno» è il numero giusto
      per la domanda «cosa si guadagna a prenderlo». L'audio faceva la prima domanda e
      rispondeva come se fosse la seconda.

      COSA MANCA: la mitigazione non è decisa, e non la decide un rilievo. L'opzione
      nota è un mediatore — un processo separato che tiene il token ed espone al gateway
      solo «manda questo messaggio a questo destinatario», così una compromissione del
      gateway permette di mandare messaggi ma non di portarsi via l'identità del bot.
      Costa un container, un canale interno e una superficie nuova da presidiare, su una
      macchina da 4 GB e per un bot mono-utente. È un baratto vero, non un fix ovvio:
      va deciso da chi possiede la macchina, e finché non è deciso questa voce resta
      `partial` — scritta, non risolta, e con lo stato che lo dice.

  - id: H55
    severity: medium
    title: "La telemetria poteva far cadere una riparazione: progress_write/status_write scrivevano nudi, e una PermissionError uccideva `vps1777 update` a metà"
    status: partial
    since: v0.40.8
    evidence:
      - file: tools/vps1777.py
        contains:
          - "def _scrivi_telemetria"
          - "_TELEMETRIA_MUTA"
          - "RACCONTARE l'aggiornamento, non a farlo"
      - file: tools/tests/test_vps1777.py
        contains:
          - "test_progress_write_il_caso_esatto_della_vps_cartella_ok_file_no"
          - "test_progress_write_avvisa_una_volta_sola_e_non_quindici"
    missing: >
      TROVATO AGGIORNANDO DAVVERO LA MACCHINA, il 27/07/2026 — non leggendo il codice:
      `vps1777 update`, cioè il comando che docs/UPDATE.md consiglia, è morto allo
      step 4 con un traceback Python e `PermissionError` su
      onboarding/update_progress.json.

      IL MECCANISMO: `vps1777-update.service` gira come `User=root`, e ogni giro del
      timer automatico lascia quel file di proprietà di root. Tutto il resto di
      onboarding/ è dell'utente del servizio. Da quel momento il comando manuale —
      lanciato come utente del servizio, che è il modo naturale — non può più
      riscriverlo. Sulla VPS il file era di root dalle 01:57.

      PERCHÉ È UNA CLASSE E NON UN INCIDENTE: `update_progress.json` e
      `update_status.json` sono ciò che i pannelli LEGGONO per disegnare la barra di
      avanzamento e il badge «aggiornamento disponibile». Non servono a fare l'update:
      servono a mostrarlo. Un aggiornamento — cioè una riparazione — è stato abortito
      perché non si riusciva a scrivere il file che lo RACCONTA. Il fail-closed è
      giusto sulla firma del bundle, dove si rifiuta di installare qualcosa di non
      verificato; è sbagliato qui, dove si rifiuta di riparare perché non si riesce a
      raccontarlo.

      FATTO: `_scrivi_telemetria()` avvisa e prosegue invece di sollevare, UNA volta
      per esecuzione (un update ha quindici step: quindici righe identiche seppelliscono
      il resto dell'output proprio quando serve leggerlo). E quando gira da root
      riallinea il file al proprietario della cartella, così il comando manuale
      successivo lo trova scrivibile: si toglie la causa, non solo il sintomo.
      6 test, con la CONTROPROVA fatta sul caso ESATTO della VPS — cartella scrivibile
      e singolo FILE no. I primi due test rendevano non scrivibile la CARTELLA: stessa
      classe, meccanismo diverso, e un fix collaudato solo su quello sarebbe stato
      verde sul caso sbagliato. Verificata anche in negativo (`except OSError` reso
      inefficace → 3 test rossi con PermissionError), e la controprova al primo
      tentativo era invalida — la mutazione lasciava un `except` orfano e il file non
      compilava: un rosso da SyntaxError non prova niente sul fix.

      COSA MANCA:
        (a) il ramo che riallinea il proprietario NON è esercitato dai test: richiede
            di girare da root, e la suite gira da utente. È scritto e provato solo
            dalla lettura — che è precisamente ciò che H52 denuncia.
        (b) sulla macchina il file resta di root finché non ci passa sopra un
            aggiornamento con QUESTA versione del CLI: la 0.40.7 installata non ha
            ancora il fix. Fino ad allora il comando manuale è ancora rotto lì.
        (c) la causa a monte — la unit gira come root perché le serve docker e
            l'installazione del binario — non è toccata. Qui si è tolto il danno,
            non l'asimmetria.

  - id: H56
    severity: medium
    title: "La seconda metà di H14 — nello snapshot pre-update archive-data resta IN CHIARO: funzionale al rollback, non rimovibile, e finora non scritto da nessuna parte"
    status: partial
    # La CONDIZIONE esiste da quando esiste lo snapshot (v0.30.0). Questa data dice
    # quando è entrata NEL REGISTRO, che è un'altra cosa: separare «da quando è vero»
    # da «da quando lo diciamo» è la stessa disciplina con cui H51 distingue
    # l'origine dall'impatto. Per due mesi è stato vero e non scritto.
    since: v0.40.8
    evidence:
      # LA RICEVUTA: la ragione esiste nel codice e non può sparire in silenzio.
      - file: tools/vps1777.py
        contains:
          - "serve all'auto-rollback, che gira sulla VPS e non può dipendere dalla chiave"
      # IL PRESIDIO: l'invariante CONGELATO sul suo valore esatto. Qualunque modifica
      # alla lista — un nome diverso, un .append(), una lista costruita altrove —
      # cambia questa riga e fa rossa la CI.
      - file: tools/vps1777.py
        contains:
          - "SNAPSHOT_EXCLUDED_VOLUMES = [NLM_AUTH_VOLUME]"
    missing: >
      MISURATO SULLA VPS VIVA da abdd732a (27/07/2026, 12:3x, profilo ingress.tailscale),
      e ri-verificato da b82df434 sul registro e sul codice prima di applicarlo.

      IL FATTO: in backups/pre-update/ convivono archive-data.tar (2.581.040.640 byte) e
      gateway-data.tar (202.240 byte) IN CHIARO, mentre nella cartella padre gli stessi
      dati viaggiano cifrati con age. Lo stesso contenuto va cifrato per una strada e in
      chiaro per l'altra.

      IL DIFETTO NON È IL CHIARO — è tracciato e ha una ragione buona (lo snapshot serve
      all'auto-rollback, che gira sulla VPS e non può dipendere dalla chiave privata age,
      che sta sul PC dell'owner). IL DIFETTO È CHE IL REGISTRO DICHIARAVA CHIUSA METÀ DEL
      PROBLEMA: H14 è `closed` e il suo titolo nomina un volume solo — nlm-auth, il più
      piccolo. Chi legge «H14 closed, escludere nlm-auth ✓» conclude che «snapshot in
      chiaro» è chiuso. È chiuso per un volume su due sensibili, e quello che resta è
      dodicimila volte più grande. Nessuna voce nominava archive-data.tar in chiaro:
      verificato, zero occorrenze in tutto il registro prima di questa.

      ⭐ È LA SECONDA INCARNAZIONE DI QUESTA FORMA — non la terza, e la differenza vale
      più della somma. La forma: una voce `closed` il cui titolo nomina UN elemento di un
      insieme che ne ha più d'uno. Due casi: H42 (archive-data `:ro` in archive-mcp, `:rw`
      nel gateway, 26/07) e questa.
      🔴 RETTIFICA DI UNA MIA RIGA, scritta nel commit di rilascio e corretta qui: ci
      avevo messo dentro anche H44→H54 facendo «tre», e H44 è una forma DIVERSA — è
      `closed` su un oggetto diverso (la lacuna DOCUMENTALE), col rischio sotto che non
      aveva voce. «Il titolo copre un sottoinsieme» e «lo stato è vero di un altro
      oggetto» si somigliano perché producono lo stesso effetto sul lettore, ma si curano
      in due modi opposti: la prima allargando il titolo, la seconda aprendo una voce
      nuova. Contarle insieme faceva un pattern più grosso e un rimedio più confuso —
      ed è la stessa cosa che rimproveriamo agli audio quando gonfiano un numero.
      Vale comunque rileggere le voci `closed` il cui titolo nomina un elemento invece
      della categoria: due casi in due giorni sono abbastanza per guardare, non per
      concludere.

      LE DUE CURE OVVIE SONO ENTRAMBE SBAGLIATE, e abdd732a le ha proposte e ritirate
      entrambe leggendo il codice: cifrare lo snapshot con age lo renderebbe indecifrabile
      proprio al rollback (la chiave privata non è sulla macchina); aggiungere archive-data
      alle esclusioni romperebbe il rollback DEI DATI, che è lo scopo per cui lo snapshot
      esiste. Il criterio di H14 le esclude entrambe: si può escludere un volume se non
      serve al rollback E è comunque nel backup cifrato — per l'archivio la seconda è vera
      e la prima è falsa.

      COSA MANCA: la sola cura che non rompe il rollback è la cifratura a livello di
      volume o di disco (oggi assente: vda1 ext4, /dev/mapper vuoto). Si fa sul disco e
      non nel codice: è una decisione dell'owner, e finché non è presa questa voce resta
      `partial` — scritta, non risolta.
      E il residuo CRESCE con la frequenza dei rilasci: snapshot_prune pota per ETÀ
      (>72h) e non per numero, quindi ogni update aggiunge ~2,58 GB in chiaro che restano
      72 ore. Misurato: 2 snapshot conviventi = 4,9 GB, con la stessa copia dell'archivio
      due volte, identica al byte, senza deduplicazione.

      PERIMETRO DELLA MISURA, perché senza non è un dato: una macchina, un profilo di
      ingresso, immagini 0.40.5, ore 12:3x del 27/07. La chiave pubblica age non è stata
      cercata oltre .env e compose.yaml — si dice dove non si è guardato, non che non ci sia.

      📌 NOTA SUL PRESIDIO, e viene da un errore commesso scrivendo questa voce: la prima
      stesura usava `not_contains` con DUE formulazioni possibili dell'aggiunta. Sarebbe
      stata una denylist sul CASO IMMAGINATO — un `.append()`, un nome diverso, una lista
      costruita altrove, e il presidio resta verde mentre il rollback muore. La forma
      corretta è l'opposto: `contains` sul valore ESATTO che deve restare tale, che copre
      tutte le varianti per costruzione. Raffina la regola che avevamo («not_contains è il
      presidio, contains è solo la ricevuta»): vale quando devi VIETARE la comparsa di
      qualcosa; quando devi CONGELARE un invariante, `contains` sull'esatto è più forte,
      perché non devi indovinare in quanti modi qualcuno potrebbe romperlo.
