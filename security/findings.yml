  - id: H49
    severity: low
    title: "Fail-closed della supply-chain (cosign obbligatorio) ha una via d'emergenza dichiarata"
    status: closed
    since: v0.23.0
    why: >
      L'audio del round-4 ha chiuso su una domanda che nessuna voce del registro copriva:
      un fail-closed che blocca il canale di aggiornamento è corretto contro un artefatto
      compromesso, ma diventa un denial-of-service autoinflitto se sigstore o il registry
      sono irraggiungibili durante una crisi che richiede una patch urgente. 48 voci nel
      registro, zero sul fail-closed della supply-chain.
    evidence:
      - file: tools/vps1777.py
        contains:
          - "VPS1777_REQUIRE_COSIGN=0"
          - "via d'emergenza"
          - "firma cosign NON verificata"
      - file: .env.example
        contains: ["VPS1777_REQUIRE_COSIGN"]
      - file: tools/vps1777.py
        contains:
          - "def cosign_bypass_status"
          - "COSIGN_BYPASS_MAX_DAYS"
      - file: tools/tests/test_vps1777.py
        contains:
          - "test_cosign_bypass_dimenticato_diventa_scaduto"
          - "test_cosign_bypass_rimosso_fa_sparire_la_voce_e_il_marcatore"
    note: >
      La domanda dell'audio era buona, la risposta era già nel codice: VPS1777_REQUIRE_COSIGN=0
      (o --no-require-cosign) sbypassa la verifica, e il messaggio d'errore stesso la cita come
      "via d'emergenza CONSAPEVOLE" — non un default, un interruttore esplicito che l'operatore
      deve azionare sapendo cosa sta facendo. Non è un buco: era un trade-off senza coordinata,
      la stessa classe di H43/archive_desc_secret di oggi.

      CORREZIONE (stessa giornata, riverifica riga-per-riga di setaccio): la nota sopra era
      imprecisa su due punti. ① L'interruttore NON salta la firma quando è verificabile —
      fetch_bundle() la esegue comunque se .sig/.pem esistono; salta solo quando cosign manca
      e non è installabile, o la release non ha .sig/.pem: è un fail-open ultima-spiaggia più
      prudente di come questa voce lo descriveva. ② MA nel caso in cui salta davvero, il ramo
      non lasciava una riga — nessun warn, nessun audit: un bundle non firmato si installava in
      silenzio. Fix in tools/vps1777.py: warn() nel ramo. ③ E l'interruttore è persistente, non
      one-shot: letto dal .env a ogni update, incluso l'auto-update settimanale — chi lo mette
      per sbloccarsi in una crisi e si dimentica di toglierlo lascia la verifica firma disattivata
      a tempo indeterminato. Resta [da-tarare]: un avviso periodico se REQUIRE_COSIGN=0 resta nel
      .env oltre N giorni, non ancora implementato.

      IMPLEMENTATO il 27/07/2026 — e il ritardo è il dato più utile di questa voce. Il [da-tarare]
      qui sopra è del 04/07: per 23 giorni il buco è stato SCRITTO, esatto, in un registro che
      una pipeline controlla a ogni commit — e non è diventato codice, perché niente falliva se
      restava prosa. È la domanda che Neo ha fatto il 27/07 ("trovate un problema, lo scrivete
      nel durevole, ma poi rimane li o lo fissate?"): la risposta misurata era «rimane lì», e
      questa riga è la prima volta che si muove. Il round-7bis ha rialzato lo stesso punto senza
      sapere che era già dichiarato: un audit esterno che ri-scopre un tuo [da-tarare] non ti sta
      dicendo una cosa nuova, ti sta misurando quanto è vecchia.

      COSA FA: cosign_bypass_status() marca in onboarding/cosign_bypass_since il momento in cui
      il CLI vede per la prima volta la flag, e cmd_secrets_status (timer settimanale, canale
      Telegram, pagina /admin/secrets già esistenti) la mostra come voce scaduta oltre
      COSIGN_BYPASS_MAX_DAYS. Il marcatore si cancella da sé appena la flag sparisce.

      COSA NON FA, deliberatamente: il round-7bis proponeva un TTL di 24h che FORZA il ri-armo
      della verifica. Rifiutato — è la stessa forma del lock-out documentato allo step 4
      dell'update: la crisi che ti ha fatto mettere la flag può durare più di 24 ore, e il
      ri-armo automatico ti chiude fuori mentre stai riparando. Un controllo che decide sul
      passato non deve poter bloccare il futuro: qui si alza la voce, non si gira la chiave.
      LIMITE DICHIARATO: l'età è "da quando il CLI l'ha vista", non "da quando è stata scritta" —
      l'mtime del .env si azzera a ogni modifica per qualunque motivo e darebbe un'età sempre
      più giovane del vero, cioè un falso verde (la classe di H51). Meglio un'età per difetto
      e dichiarata che una data che mente in silenzio.

  - id: H50
    severity: high
    title: "Uscita Internet del gateway: MISURATA sul vivo, chiusa nel codice, non ancora in produzione"
    status: partial
    resta_aperto: >
      Niente sul difetto, che è chiuso e misurato: restano due opzioni SCARTATE (refresh on-demand via path unit, egress ristretto a api.github.com) e la scelta è scritta.
    since: v0.40.3
    evidence:
      - file: compose.yaml
        # RICEVUTE: sono commenti, e devono restare — spiegano perché una rete NON
        # è qui. Non presidiano un comportamento: presidiano la ragione.
        ricevute:
          - "`ingress` NON qui (H50)"
          - "nessun servizio di questo file può USCIRE su Internet"
      - file: services/gateway/app/admin.py
        contains: ["Refresh non disponibile", "non è un guasto"]
      - file: tools/prove-empiriche/prova-1-gateway-non-esce.sh
        contains: ["il gateway raggiunge Internet"]
      - file: compose.ingress.tailscale.yaml
        contains:
          - "enable_ip_masquerade"
        # RICEVUTA: il commento che racconta l'incidente del 27/07. Se sparisce,
        # la prossima persona rifà lo stesso errore senza sapere che c'è già stato.
        ricevute:
          - "NON SI PUÒ PUBBLICARE DA UNA RETE"
    missing: >
      MISURATO sul vivo (26/07/2026, prova-1, profilo Tailscale Funnel): il gateway
      ESCE su Internet a livello TCP (socket verso 1.1.1.1:443 riuscito dentro il
      container). È il servizio che monta 5 secret ed è l'unico esposto al pubblico:
      un gateway compromesso avrebbe una via di esfiltrazione. L'unica destinazione
      legittima nota nel codice (ricerca su tutti i moduli, 26/07) è api.github.com
      per il check-release (admin.py, _fetch) — le altre due chiamate uscenti sono
      interne alla rete docker.

      DECISIONE Neo (26 lug, sul canale delle decisioni): si lascia com'è, per ora.
      «Lasciare aperto mi sembra davvero pericoloso… d'altra parte l'aggiornamento
      automatico sembra cosa scontata per l'utente: lasciamo com'è e segniamo nei
      documenti possibili soluzioni; vediamo se il prossimo round trova buone idee.»
      Rischio accettato, non dimenticato.

      CORREZIONE DEL COSTO, stessa sera (trovata da chi aveva scritto il quadro,
      verificata da una seconda mano su admin.py): il costo presentato a supporto
      della decisione era SOVRASTIMATO. Diceva «chiudere rende muto il check-release»;
      il vero flusso è: il pannello legge update_status.json, che scrive il TIMER
      DELL'HOST (admin.py:771 e 789) — non tocca Internet. La `_fetch()` verso
      api.github.com vive solo in update_check() (:798), cioè nel bottone
      «Ricontrolla adesso». Chiudere l'uscita NON spegne l'avviso: degrada solo il
      refresh manuale (l'avviso può invecchiare fino a 24h). La decisione è stata
      presa sul quadro precedente e il quadro corretto è stato ridato al proprietario
      la stessa sera: la voce resta `accepted` finché lui non la rivede.

      FATTO NEL CODICE (26/07, dopo la correzione del costo): applicata la
      soluzione (a) — `- ingress` tolta dal blocco gateway di compose.yaml, che
      resta solo su `backend` (internal: true) ⇒ nessuna uscita NAT. VERIFICATO
      eseguendo `docker compose config` su tutti e tre i profili, non leggendo:
      tailscale → gateway [backend] + ports 127.0.0.1:8080 (e la rete `ingress`
      non viene nemmeno creata, nessuno la usa); caddy → gateway [backend,
      ingress] e caddy [ingress], si parlano; cloudflared → gateway [backend,
      ingress]. Insieme: il ramo d'errore di update_check() in admin.py ora
      spiega che il refresh non disponibile NON è un guasto e che l'avviso
      continua ad aggiornarsi dal timer dell'host — senza affermare quale delle
      due cause sia, perché il gateway non può distinguere «non ho rete» da
      «GitHub non risponde». 175 test del gateway verdi.

      IN PRODUZIONE DAL 27/07 07:56, e l'uscita è chiusa DAVVERO: l'auto-update
      ha installato la 0.40.5 da sé e prova-1 è passata da FAIL a PASS senza che
      nessuno toccasse la macchina — socket verso 1.1.1.1:443 in TimeoutError dal
      gateway, e la controprova positiva dal container del bot, dove lo stesso
      socket RIESCE (senza quella, un timeout non distingue «blocco mirato» da
      «rete guasta»). È la prima volta in sei round che un FAIL misurato si chiude
      con una misura e non con uno sha.

      🔴 MA IL FIX HA ROTTO LA PRODUZIONE PER 1h27m50s, ed è la parte che conta.
      Tolta `ingress`, il gateway è rimasto SOLO su `backend`, che è
      `internal: true` — e da una rete `internal` UNA PORTA NON SI PUÒ PUBBLICARE:
      docker accetta la direttiva `ports:` e non la applica, in silenzio. Il
      Funnel bussava a 127.0.0.1:8080 e non c'era nessun listener. Misurato con
      tre strumenti indipendenti: `docker port` vuoto, `ss -ltn` senza 8080,
      connessione rifiutata.

      COME È PASSATO IL CONTROLLO: qui sopra c'è scritto «VERIFICATO eseguendo
      `docker compose config` su tutti e tre i profili, non leggendo». Era vero e
      INUTILE — `config` dice che cosa è DICHIARATO, non che cosa docker riesce ad
      APPLICARE, e infatti mostrava il port mapping corretto mentre il servizio era
      giù. Aver eseguito uno strumento non è aver misurato l'effetto: la frase
      resta scritta com'era, con accanto il suo esito, perché è il reperto.

      CURA (27/07, verificata sui due esiti prima di dichiararla): una rete bridge
      dedicata al profilo Tailscale — `funnel` in compose.ingress.tailscale.yaml —
      con `com.docker.network.bridge.enable_ip_masquerade: "false"`. Il DNAT in
      ingresso resta (la porta si pubblica e serve), l'SNAT in uscita no (i
      pacchetti verso Internet partono con un IP privato e non tornano). Misurata
      su due versioni di docker — 20.10.24 sulla VPS e 29.4.1 in laboratorio — e
      sul vivo dopo l'applicazione: porta pubblicata, HTTP 200 dall'host, HTTP 200
      dall'esterno attraverso il Funnel, uscita in TimeoutError, controprova dal
      bot aperta.

      PERCHÉ UNA RETE NUOVA E NON `ingress` COL MASQUERADE SPENTO: `ingress` è la
      rete su cui il gateway parla con caddy e cloudflared negli altri due profili,
      e cloudflared DEVE uscire su Internet per funzionare. Spegnere il masquerade
      lì avrebbe chiuso questo buco rompendo quel profilo.

      PERCHÉ RESTA `partial` E NON `closed`: nei profili caddy e cloudflared il
      gateway ridichiara `ingress`, che ha il masquerade attivo — lì l'uscita NAT
      è ancora aperta. Chiuso per il profilo in produzione (Tailscale), aperto per
      gli altri due. Si chiude quando anche quelli hanno una via d'ingresso senza
      uscita, oppure quando la si accetta con una motivazione scritta.

      SOLUZIONI SCARTATE, e perché — così non si ridiscutono da zero:
      (b) il bottone scrive un INTENT che l'host consuma (pattern collect→apply,
          già in casa: systemd/vps1777-update.path). Non perderebbe NIENTE, ma
          aggiunge un componente e un modo nuovo di fallire in silenzio (se la
          path unit muore il refresh tace, servirebbe un heartbeat). Tenuta in
          riserva: si fa solo se il refresh on-demand si rivelasse necessario.
      (c) egress ristretto alla sola api.github.com (allowlist di rete): fragile
          ai cambi di IP di GitHub e complica il deploy. Scartata.

  - id: H51
    severity: high
    title: "Il presidio di salute sonda dal lato in cui il guasto non si vede: healthcheck e health-gate interrogano il loopback DA DENTRO il container"
    status: partial
    resta_aperto: >
      La finestra cieca fra due giri del check: la classe è presidiata dove faceva male, non ovunque. Sonda continua verso Internet: si può fare, non è deciso.
    scoperta:
      quando: "2026-07-27"
      come: incidente
      nota: "il servizio irraggiungibile per 1h27m50s mentre tre presìdi davano verde"
    natura: comportamento
    since: v0.40.6
    evidence:
      - file: tools/prove-empiriche/prova-7-porta-pubblicata-davvero.sh
        contains:
          - "VPS1777_SERVIZIO"
        # RICEVUTA: l'intestazione della prova, cioè la domanda che si pone.
        ricevute:
          - "dall'host, la porta esiste e risponde?"
      - file: compose.ingress.tailscale.yaml
        contains: ["enable_ip_masquerade"]
      - file: tools/vps1777.py
        contains:
          - "def valuta_porta_esterna"
          - "porta_esterna_ok"
          - "irraggiungibile dall'host"
          - "def _sorveglia_raggiungibilita"
          - "irraggiungibile_da"
          - "def funnel_ok"
          - "def nome_pubblico_funnel"
      - file: tools/tests/test_vps1777.py
        contains:
          - "test_porta_esterna_il_caso_dell_incidente_nessuna_porta_e_nessun_proxy"
          - "test_raggiungibilita_e_cablata_in_check_e_prima_del_fetch"
          - "test_raggiungibilita_ritorno_misura_la_durata_fra_i_due_istanti"
          - "test_funnel_non_e_nel_cancello_dell_update"
          - "test_funnel_giu_e_un_rosso_dopo_piu_di_un_tentativo"
    missing: >
      MISURATO sul vivo, come incidente vero e non come ipotesi (27/07/2026,
      durata misurata 1h27m50s di irraggiungibilità pubblica del servizio).

      GLI ESTREMI, perché una durata senza i suoi due istanti è un aggettivo:
        inizio  2026-07-27T05:56:13Z — l'update ricrea i container; il gateway
                nasce senza porta pubblicata. [istante misurato su archive-mcp e
                nb1777-mcp con `docker inspect .Created`; per il gateway è
                un'INFERENZA FORTE — quel container non esiste più, ma è stato
                creato dallo stesso `compose up`]
        fine    2026-07-27T07:24:03Z — il gateway riparte con la rete `funnel`
                e la porta torna pubblicata. [misurato: `.State.StartedAt`]
      ⚠️ La macchina è su fuso US/Eastern (EDT, -0400) mentre il proprietario
      legge in CEST (+0200): sei ore di scarto. Il journal dice «01:51:55» per
      un evento che per lui sono le 07:51:55. Un log letto senza questa riga
      sposta ogni evento di sei ore, e la cronologia diventa un'altra storia.

      🔴 CORREZIONE DI UNA MIA MISURA, scritta qui perché è dello stesso tipo
      che questa voce denuncia: le prime stesure dicevano «1h40m». Non l'avevo
      misurato — l'avevo dedotto dall'ora di partenza dell'update (07:51) e
      dall'ora in cui stavo scrivendo, cioè da due istanti che non sono gli
      estremi del guasto. Dodici minuti in eccesso, dentro il documento che
      accusa i numeri senza misura. Corretto sugli istanti reali.

      IL DIFETTO: lo healthcheck del gateway esegue, DENTRO il container, una
      richiesta a http://127.0.0.1:8080/health. Sul loopback interno la porta
      risponde SEMPRE — anche quando dall'esterno non è pubblicata affatto.
      `healthy` non significa «raggiungibile»: significa «il processo parla con
      sé stesso». L'health-gate dell'auto-update usa lo stesso segnale, quindi
      la CATENA DI ROLLBACK AUTOMATICO eredita la stessa cecità.

      COSA È SUCCESSO, e perché è una classe e non un incidente: il fix di H50
      ha lasciato il gateway solo su `backend` (`internal: true`), e da una rete
      internal una porta NON SI PUÒ PUBBLICARE — docker accetta `ports:` e non
      la applica, in silenzio. Durante tutto il guasto:
        · il container risultava `healthy`                     → nessun allarme
        · `docker compose config` mostrava il port mapping     → nessun allarme
        · l'health-gate ha dato OK e NON ha fatto rollback     → nessun allarme
      Tre verdi indipendenti su un servizio giù. Il guasto l'ha visto una
      persona aprendo l'URL. Un presidio che non può osservare il guasto che
      dovrebbe osservare non tace: DÀ VERDE, ed è peggio del silenzio.

      COSA È GIÀ FATTO (perché `partial` e non `open`): esiste la prova-7, che
      misura dall'HOST — fuori dal container — che la porta sia pubblicata E che
      risponda, e distingue «non applicabile» (profilo con proxy in container)
      da PASS, uscendo 2 e mai 0. Provata sui DUE esiti prima di essere
      dichiarata: PASS sul gateway reale, FAIL su un container deliberatamente
      privo di porta pubblicata (exit 1). Limite noto: il ramo che segnala
      «il container è `healthy` lo stesso» non è stato esercitato — il container
      di controprova non aveva healthcheck.

      (a) CHIUSO — l'health-gate ora guarda anche da fuori. `health_gate()`
      chiama `porta_esterna_ok()`, che dall'HOST verifica che la porta sia
      pubblicata e risponda 200; se non lo è, il gate diventa rosso e la catena
      di rollback automatico riparte. La logica di verdetto è isolata in
      `valuta_porta_esterna()` — pura, quindi provabile su tutti i rami senza
      un docker vivo: 7 test, incluso quello che riproduce lo stato esatto
      dell'incidente (nessuna porta, nessun proxy → rosso, col motivo scritto)
      e uno che verifica che la chiamata sia davvero CABLATA in `health_gate`,
      perché test verdi su codice scollegato sono l'esca di questa stessa
      classe. Regola scritta dentro: si fallisce solo con EVIDENZA POSITIVA del
      guasto — «non ho misurato» non è «è rotto», perché qui un falso rosso
      costa un rollback non necessario; e con caddy/cloudflared la sonda si
      dichiara non applicabile invece di accusare. Provata anche sul vivo
      (27/07, sulla VPS in produzione): VERDE, col comando compose reale e i
      suoi overlay — nessun falso rosso in agguato al prossimo aggiornamento.

      (b) CHIUSO (27/07, stessa giornata) — la porta è guardata da fuori anche QUANDO
      NON SI AGGIORNA. `_sorveglia_raggiungibilita()` gira dentro `vps1777 check`, che
      il timer lancia ogni giorno con la notifica attiva: nessuna unit nuova da
      installare, ricordare e dimenticare. È chiamata PRIMA del fetch delle release,
      e l'ordine è presidiato da un test — il giorno in cui la macchina sta peggio è
      anche quello in cui GitHub può risultare irraggiungibile, e da lì `cmd_check`
      esce subito: una sonda messa dopo non verrebbe mai eseguita proprio quando serve.
      Notifica le TRANSIZIONI e non lo stato: la caduta quando avviene (una volta sola,
      l'istante non si sposta), il ritorno con la DURATA misurata fra i due istanti —
      cioè esattamente il numero che il 27/07 nessuno aveva e che infatti abbiamo
      dedotto sbagliando di dodici minuti. Un avviso che si ripete ogni giorno uguale
      si impara a ignorare; uno che non si spegne mai non è un avviso.
      6 test, incluso quello che verifica l'ordine e quello che pretende SILENZIO
      quando la sonda non ha potuto misurare (regola invariata: si grida solo con
      evidenza positiva del guasto — un falso rosso qui sveglia una persona per niente,
      e la volta dopo non la sveglia più).
      LIMITE: la cadenza è giornaliera. Restringe la finestra cieca, non la chiude.

      (c) CHIUSO (27/07, stessa giornata) — `funnel_ok()` ESCE dal server e rientra da
      Internet. Con la porta viva e il tunnel giù, per chi apre l'indirizzo il servizio
      è giù e la sonda sull'host direbbe «tutto bene»: è il buco che restava.
      🔴 L'AVEVO DATO PER IMPOSSIBILE, e l'ho misurato invece di assumerlo: credevo che
      dalla macchina il nome pubblico risolvesse all'indirizzo del tailnet, facendo un
      giro su sé stesso. FALSO — risolve a indirizzi PUBBLICI dell'ingresso Tailscale.
      Misura del 27/07 dalla VPS: 200 in 360 ms sul nome pubblico da un indirizzo
      pubblico dell'ingresso Tailscale (l'indirizzo REDATTO — vedi H60),
      contro 000 sull'indirizzo di tailnet. La richiesta esce davvero: la sonda è una
      sonda, non un'eco. (Se non l'avessi misurato avrei scritto «non fattibile dalla
      macchina» — un limite dedotto, cioè la stessa classe di errore della durata
      dedotta di stamattina.)
      Collaudata sui TRE rami sulla macchina in produzione: PASS sul Funnel vero,
      FAIL su un nome inesistente, «non applicabile» quando il profilo non usa Funnel.
      Due tentativi con pausa: un singolo errore di rete verso Internet è comune, e un
      falso allarme che arriva due volte a vuoto smette di essere letto.
      ⚠️ NON è nell'health-gate dell'update, ed è una scelta con un test che la tiene
      ferma: quel cancello giudica ciò che l'update PUÒ rompere, e un update non tocca
      il tunnel — un suo singhiozzo farebbe tornare indietro una versione sana. Nella
      sorveglianza giornaliera invece un falso allarme costa una notifica, non un
      rollback: lì la soglia può essere più bassa perché il prezzo dell'errore è più
      basso. Stesso fatto, due presìdi, due soglie diverse, e il perché è scritto.

      (d) CHIUSO (27/07, stessa giornata) — `tools/prove-empiriche/` entra nel pacchetto
      di rilascio (`cp -r tools/prove-empiriche bundle/tools/` in release.yml, e `copy2`
      lato updater conserva i permessi: arrivano eseguibili). Sono l'unico strumento che
      misura sul SISTEMA VIVO ciò che gli altri gate verificano leggendo file, e finora
      restavano nel repo di sviluppo: sulla macchina andavano copiate a mano, quindi non
      c'erano. Un presidio che per essere usato richiede un gesto manuale, nel giorno del
      guasto non esiste. 72 KB di shell senza dipendenze: il costo non era l'argomento.
      Un test lo tiene: se qualcuno toglie la riga, la build lo dice.
      ⚠️ LIMITE del test, dichiarato: legge una STRINGA nel workflow, non costruisce il
      pacchetto. È la classe che H52 denuncia, applicata a sé stessa — prende «qualcuno
      ha tolto la riga», non «il tar è arrivato completo».
      📌 La stessa assenza aveva due facce: le prove erano fuori dal bundle E fuori dal
      corpus dell'audio (rilievo di 71d540e6 nel piano del round-8). Un file che non esce
      di casa in nessuna delle due direzioni finisce per non esistere per nessuno tranne
      chi l'ha scritto.

      (d) VERIFICATO IN PRODUZIONE (27/07, v0.40.8): le prove sono ARRIVATE sulla macchina
      col pacchetto, `-rwxr-xr-x`, e la prova-7 è stata eseguita là per la prima volta
      senza copiarla a mano — PASS, con il suo limite stampato in coda («misura la porta
      sull'host, non il percorso pubblico»). Chiuso significa in produzione, e questo lo è.

      RESTA `partial` PER UNA COSA SOLA, e non è un pezzo non fatto: è un limite del
      disegno scelto. La sorveglianza esterna gira UNA VOLTA AL GIORNO, quindi fra due
      giri esiste una finestra cieca fino a 24 ore. Rispetto al 27/07 — dove ad accorgersi
      del guasto è stata una persona — è un guadagno, non una copertura: un guasto che
      inizia e finisce dentro la finestra non lo vede nessuno. Portarla a pochi minuti
      significherebbe un timer dedicato e traffico verso Internet ogni volta: si può fare,
      non è stato deciso, e finché non lo è la voce dice che la finestra c'è invece di
      dichiararsi chiusa su una classe che copre a intervalli.
      Resta `partial` per la finestra cieca fra due giri: la classe è presidiata dove faceva
      male, non ovunque — e la differenza è scritta invece che taciuta.

