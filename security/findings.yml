      E LA SECONDA METÀ, che è più grande della prima: anche col rendiconto giusto,
      quella riga finisce in /var/log/backup.log DENTRO il container del backup, che
      nessuno apre. Il 27/07 la finestra è passata da sette giorni a due e l'ha scoperto
      una sessione che stava misurando altro. Non esisteva una sola sonda che guardasse
      quel numero, e il registro non aveva una voce che lo dicesse.

      IL RIMEDIO, in due pezzi:
      ① `backup.sh` stampa la copertura in giorni distinti col loro intervallo, e AVVISA
      quando è sotto i sette — con la nota su come leggerla (dopo un'installazione nuova
      è normale, altrimenti il sospettato tipico è un giorno con più aggiornamenti).
      ② `_sorveglia_copertura_backup` nel `check` giornaliero — dove il timer gira già,
      accanto alla sonda di raggiungibilità e per la stessa ragione: una domanda che si
      può fare in un posto che c'è già non merita un'unità nuova da installare, ricordare
      e dimenticare.

      ⭐ E LA DECISIONE CHE DECIDE SE QUESTO PRESIDIO VERRÀ LETTO O DISATTIVATO: notifica
      una REGRESSIONE, non una finestra non ancora piena. Dopo un'installazione nuova la
      copertura è 1, poi 2, poi 3 — normale, e un allarme che suona lì verrebbe silenziato
      prima di servire davvero. Quello che non è mai normale è che scenda sotto il massimo
      già raggiunto, perché a regime i backup si SOSTITUISCONO, non si perdono. La memoria
      è il massimo storico; l'allarme è la discesa da lì; e si notifica la transizione, non
      lo stato — un messaggio al giorno che dice sempre la stessa cosa smette di essere
      letto entro una settimana.

      ⚠️ RESIDUO DICHIARATO: `copertura_max` non scende mai. Se un giorno la ritenzione
      venisse volutamente accorciata, il presidio resterebbe in allarme finché qualcuno
      non tocca lo stato. È il prezzo di non avere una soglia configurabile, ed è scritto
      qui invece di essere scoperto.

      CHIUSA il 27/07 con la v0.40.11 in produzione e le prove ESEGUITE sulla macchina:
      il rendiconto parla in giorni e avvisa, la sorveglianza gira dentro `check`.

      ⭐ E LA MISURA CHE VALE PIÙ DELLE ALTRE, presa installando questa stessa release:
      l'update NON è costato un giorno. Alla 0.40.10 il backup pre-update girava ancora
      col codice vecchio e aveva potato il 25 luglio; qui il backup nuovo del 27 ha
      SOSTITUITO quello del 27 invece di aggiungersi — prima 2 giorni, dopo 2 giorni.
      *Aggiornare non consuma più la storia: è la conferma sul vivo che H57 è curato, ed è
      arrivata da un'operazione fatta per altro.*

      ⚠️ RESIDUO REALE E NON DEL FIX: la copertura sulla macchina è di DUE giorni e ci
      resta finché le notti non la riempiono — sette il 2 agosto. Il presidio adesso lo
      DICE a ogni giro invece di lasciarlo dedurre, che è tutto ciò che poteva fare.

  - id: H60
    severity: low
    title: "Una regola scritta e non presidiata: un indirizzo pubblico è vissuto otto ore in `main` e in tre release, entrato con il commit che implementava la raccomandazione di un audit"
    status: closed
    scoperta:
