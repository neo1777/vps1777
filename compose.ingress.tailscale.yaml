# compose.ingress.tailscale.yaml — Tailscale Funnel (Tailscale gira SULL'HOST)
#
# Tailscale NON gira più in un container sidecar. Gira come servizio systemd
# sull'HOST, installato e configurato dall'installer (engine.py) o da deploy.sh:
#   tailscale up --auth-key=... --hostname=vps1777
#   tailscale serve  --bg --https=443 http://127.0.0.1:8080
#   tailscale funnel --bg 443
#
# Perché host e non sidecar (lezione appresa sul campo):
#   - il container ufficiale tailscale ha avuto un bug di containerboot
#     (panic in storeHTTPSEndpoint con TS_SERVE_CONFIG fuori da Kubernetes →
#     crash-loop, vedi v1.78.x);
#   - `network_mode: service:gateway` crea un netns fragile: ricreare il
#     gateway orfanizza il sidecar (niente DNS/proxy).
#   Sull'host `tailscaled` è robusto, sopravvive ai reboot nativamente, e la
#   config serve/funnel persiste nello stato di tailscaled.
#
# Qui pubblichiamo solo il gateway su una porta dell'host che `tailscaled`
# (sull'host) raggiunge per il serve/funnel. GATEWAY_BIND controlla l'esposizione:
#   GATEWAY_BIND=127.0.0.1 → solo loopback (produzione: lo vede solo il Funnel)
#   GATEWAY_BIND=0.0.0.0   → fallback raggiungibile via http://IP:8080 (se il Funnel non parte)
#
# Profilo: ingress.tailscale
#
# ──────────────────────────────────────────────────────────────────────────
# LA RETE `funnel`, e perché esiste (27/07, incidente in produzione)
# ──────────────────────────────────────────────────────────────────────────
# H50 ha tolto `ingress` al gateway per chiudergli l'uscita NAT verso Internet.
# La misura era giusta e l'uscita si è chiusa davvero — ma il gateway è rimasto
# SOLO su `backend`, che è `internal: true`, e:
#
#   UNA PORTA NON SI PUÒ PUBBLICARE DA UNA RETE `internal`.
#   Docker accetta la direttiva `ports:` qui sotto e NON la applica, in silenzio.
#
# Esito misurato sulla VPS: `docker port` vuoto, nessun listener su 8080,
# connessione rifiutata; il Funnel bussava a 127.0.0.1:8080 e non c'era nessuno.
# Il servizio è stato irraggiungibile da Internet per ~1h40m. Nessun presidio
# l'ha visto: l'healthcheck sonda 127.0.0.1:8080 DA DENTRO il container, dove
# la porta risponde — un container `healthy` su un servizio irraggiungibile.
#
# La cura: una rete bridge NON internal con il masquerade (SNAT) disattivato.
# Il DNAT in ingresso resta — la porta si pubblica e serve; l'SNAT in uscita no
# — i pacchetti verso Internet partono con un IP privato e non tornano.
# Misurata su due versioni di docker (20.10.24 sulla VPS, 29.4.1 in laboratorio),
# sui DUE esiti: porta che risponde E uscita in timeout, con la controprova che
# su un bridge normale l'uscita è aperta.
#
# Perché una rete NUOVA e non `ingress` col masquerade spento: `ingress` è la
# rete su cui il gateway parla con caddy e cloudflared negli altri due profili,
# e cloudflared DEVE uscire su Internet per funzionare. Spegnere lì il
# masquerade avrebbe chiuso un buco in questo profilo rompendo quell'altro.
# ⚠️ Residuo dichiarato: nei profili caddy/cloudflared il gateway riprende
# `ingress` e quindi l'uscita NAT. H50 resta `partial` per quelli.

services:
  gateway:
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:8080:8080"
    networks:
      - backend
      - funnel

networks:
  funnel:
    driver: bridge
    driver_opts:
      # ingresso sì (DNAT), uscita no (niente SNAT): è tutta la cura.
      com.docker.network.bridge.enable_ip_masquerade: "false"
