[project]
name = "vps1777-nb1777-mcp"
version = "0.1.0"
description = "vps1777 nb1777-mcp — NotebookLM wrapper via nlm CLI"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "mcp>=1.28,<2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.1",
    "starlette>=1.4.1",
    "notebooklm-mcp-cli==0.9.6",  # pin: 0.7.x usa profiles/ (vedi auth.py + /admin/nlm)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Solo per test/CI — esclusi dall'immagine (Dockerfile fa `uv sync --no-dev`).
[dependency-groups]
dev = ["pytest>=8.0"]
