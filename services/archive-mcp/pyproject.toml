[project]
name = "vps1777-archive-mcp"
version = "0.1.0"
description = "vps1777 archive-mcp — FTS5 multi-DB MCP server (claude.ai + Claude Code)"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "mcp>=1.28,<2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.3",
    "starlette>=1.6.0",
    # Ricerca ibrida (#281): l'embedding della query gira QUI, l'indicizzazione no.
    # onnxruntime+tokenizers invece di torch+sentence-transformers: stessi vettori
    # (cosine 1.000000, misurato), ~35 MB invece di ~1 GB — su una VPS da 3 GB con
    # sei container la differenza non è estetica.
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.20,<1",
    "sqlite-vec>=0.1.6,<0.2",
    "numpy>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
