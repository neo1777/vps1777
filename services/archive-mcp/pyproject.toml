[project]
name = "vps1777-archive-mcp"
version = "0.1.0"
description = "vps1777 archive-mcp — FTS5 multi-DB MCP server (claude.ai + Claude Code)"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "mcp>=1.28,<2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.3",
    "starlette>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
