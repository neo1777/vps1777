# compose.example-bot.yaml — esempio plugin bot Telegram
#
# Il bot ha il SUO token (diverso da nb1777-bot).
# Crea il file secrets/example_bot_token.txt prima di avviare.

services:
  example-bot:
    # Tetti (memoria, CPU, processi) come gli altri servizi: un plugin parte da qui, e un servizio senza tetti è il primo a far cadere gli altri. Misura il tuo e adegua.
    pids_limit: 128
    cpus: 0.5
    mem_limit: 256m
    build:
      context: ./plugins/example-bot
    image: vps1777/example-bot:${VPS1777_TAG:-dev}
    init: true
    # Il tetto ai log non attraversa i file: l'ancora `x-logging` vive in compose.yaml. Senza
    # questo blocco il servizio scrive in json-file senza limite, fino a disco pieno.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/example_bot_token
      # Il bot risponde SOLO a questo utente Telegram. 0 (o vuoto) = non risponde a nessuno.
      OWNER_ID: ${EXAMPLE_BOT_OWNER_ID:-0}
    secrets:
      - example_bot_token
    # egress: il long-poll deve USCIRE verso api.telegram.org, e `backend` è
    # internal (nessuna uscita). Come nb1777-bot in compose.yaml (H25): egress,
    # mai ingress.
    networks: [backend, egress]
    restart: unless-stopped
    # Chi resta acceso dichiara come si vede che è vivo (SIC-06): il bot tocca un file ogni 30 s,
    # e qui se ne guarda l'età. Stessa forma del bot di serie in compose.yaml.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/example-bot.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<90 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "vps1777.role=bot"
      - "vps1777.name=example"

secrets:
  example_bot_token:
    file: ./secrets/example_bot_token.txt
