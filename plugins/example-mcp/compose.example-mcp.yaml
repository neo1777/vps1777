# compose.example-mcp.yaml — esempio plugin MCP
#
# Per attivarlo:
#   1. Aggiungi a .env: GATEWAY_UPSTREAMS=...,example=example-mcp:8010
#   2. Lancia, con gli stessi -f/--profile con cui gira lo stack (qui l'ingresso di
#      default, Tailscale, senza feature opzionali):
#        docker compose -f compose.yaml -f compose.ingress.tailscale.yaml \
#          -f plugins/example-mcp/compose.example-mcp.yaml \
#          --profile ingress.tailscale up -d
#      Con Caddy o Cloudflare il file e il profilo sono quelli del tuo ingresso
#      (compose.ingress.caddy.yaml + --profile ingress.caddy, o .cloudflared), e gli
#      overlay delle feature accese vanno aggiunti (es. -f compose.ops.backup.yaml
#      --profile ops.backup): senza, `up -d` ricrea il gateway SENZA il suo ingresso.
#      Il plugin non si espone da sé: sta solo su `backend` e lo raggiunge il gateway,
#      qualunque sia l'ingresso. Vedi docs/PLUGINS.md, Step 4.

services:
  example-mcp:
    build:
      context: ./plugins/example-mcp
    image: vps1777/example-mcp:${VPS1777_TAG:-dev}
    init: true
    environment:
      PLUGIN_HOST: 0.0.0.0
      PLUGIN_PORT: 8010
      FASTMCP_STATELESS_HTTP: "true"
    networks: [backend]
    expose: ["8010"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.create_connection(('127.0.0.1',8010),timeout=3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "vps1777.role=mcp"
      - "vps1777.name=example"
