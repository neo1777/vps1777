# compose.ingress.caddy.yaml — Caddy reverse proxy + Let's Encrypt
#
# Caddy ascolta su 80+443, fa cert auto via ACME (HTTP-01 default).
# Per DNS-01 (certificati senza porta 80, o wildcard) c'è la feature `caddy-dns01`
# in VPS1777_FEATURES: l'overlay compose.ops.caddy-dns01.yaml ridefinisce questo
# stesso servizio con l'immagine vps1777-caddy-dns01 (plugin Cloudflare) e
# ingress/Caddyfile.dns01. Vedi docs/INGRESS.md §DNS-01.
#
# Setup: CADDY_DOMAIN + CADDY_EMAIL in .env
#
# Profilo: ingress.caddy

services:

  caddy:
    profiles: [ingress.caddy]
    image: caddy:2.11-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    container_name: vps1777-caddy
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]  # serve per ascoltare su 80/443
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?CADDY_DOMAIN obbligatorio in .env}
      CADDY_EMAIL: ${CADDY_EMAIL:?CADDY_EMAIL obbligatorio in .env}
    volumes:
      - ./ingress/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data            # certificati ACME
      - caddy-config:/config
    networks:
      - ingress
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/health"]
      interval: 60s
      timeout: 5s
      retries: 3

  gateway:
    networks:
      - backend
      - ingress

volumes:
  caddy-data:
  caddy-config:
