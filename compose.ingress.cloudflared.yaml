# compose.ingress.cloudflared.yaml — Cloudflare Tunnel
#
# Outbound tunnel verso CF — nessuna porta aperta sul VPS, anti-DDoS gratis.
# Vincolo: serve account Cloudflare + tunnel pre-creato + token.
#
# Setup:
#   1. Crea il tunnel su https://one.dash.cloudflare.com → Networks → Tunnels
#   2. Configura hostname che punti a http://gateway:8080
#   3. Copia il token in secrets/cloudflared_token.txt
#
# Profilo: ingress.cloudflared

services:

  cloudflared:
    profiles: [ingress.cloudflared]
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    container_name: vps1777-cloudflared
    restart: unless-stopped
    # 🔴 DUE DIFETTI, misurati il 01/10/2026, per cui questo ingresso NON poteva partire
    #   dal 23/06 (nascita dell'ingresso modulare):
    #   · la 2024.12.0 NON conosce TUNNEL_TOKEN_FILE: lo ignora e si ferma con
    #     «"cloudflared tunnel run" requires the ID or name of the tunnel» (lo stesso token
    #     finto passato per valore, invece, viene letto e rifiutato: «token is not valid»);
    #   · l'immagine gira come `nonroot` (UID 65532) e il token è 600 dell'operatore
    #     (UID 1000, docs/SECRETS.md): anche una versione che conosce il file risponde
    #     «Failed to read token file: … permission denied».
    #   Cura: una versione che legge il file, e lo stesso UID degli altri servizi del
    #   progetto. Un tunnel in USCITA non vuole né root né porte privilegiate.
    #   Prova: 2026.9.3 + --user 1000:1000 + token finto 600 → «token is not valid», cioè
    #   il file è stato letto. (tools/tests/test_cloudflared_legge_il_token.py)
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflared_token
    secrets:
      - cloudflared_token
    networks:
      - ingress
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cloudflared tunnel info 2>&1 | grep -q healthy || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3

  gateway:
    networks:
      - backend
      - ingress

secrets:
  cloudflared_token:
    file: ./secrets/cloudflared_token.txt
