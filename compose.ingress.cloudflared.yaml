# compose.ingress.cloudflared.yaml — Cloudflare Tunnel
#
# Outbound tunnel verso CF — nessuna porta aperta sul VPS, anti-DDoS gratis.
# Vincolo: serve account Cloudflare + tunnel pre-creato + token.
#
# Setup:
#   1. Crea il tunnel su https://one.dash.cloudflare.com → Networks → Tunnels
#   2. Configura hostname che punti a http://gateway:8080
#   3. Il token va in secrets/cloudflared_token.txt (600): setup.sh, deploy.sh e
#      l'installer guidato lo chiedono e lo scrivono da sé
#
# Profilo: ingress.cloudflared

services:

  cloudflared:
    # Tetti (memoria, CPU, processi) come gli altri servizi: non misurati su un'installazione viva, tenuti larghi (a riposo sta in decine di MB).
    pids_limit: 256
    cpus: 1.0
    mem_limit: 256m
    # Il tetto ai log non attraversa i file: l'ancora `x-logging` vive in compose.yaml, e questo
    # container ne restava senza (json-file senza limite: un log per richiesta fino a disco pieno).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    profiles: [ingress.cloudflared]
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    container_name: vps1777-cloudflared
    restart: unless-stopped
    # 🔴 DUE DIFETTI, misurati il 01/10/2026, per cui questo ingresso NON poteva partire
    #   dal 23/06 (nascita dell'ingresso modulare):
    #   · la 2024.12.0 NON conosce TUNNEL_TOKEN_FILE: lo ignora e si ferma con
    #     «"cloudflared tunnel run" requires the ID or name of the tunnel» (lo stesso token
    #     finto passato per valore, invece, viene letto e rifiutato: «token is not valid»);
    #   · l'immagine gira come `nonroot` (UID 65532) e il token è 600 dell'operatore
    #     (UID 1000, docs/SECRETS.md): anche una versione che conosce il file risponde
    #     «Failed to read token file: … permission denied».
    #   Cura: una versione che legge il file, e lo stesso UID degli altri servizi del
    #   progetto. Un tunnel in USCITA non vuole né root né porte privilegiate.
    #   Prova: 2026.9.3 + --user 1000:1000 + token finto 600 → «token is not valid», cioè
    #   il file è stato letto. (tools/tests/test_cloudflared_legge_il_token.py)
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # `--metrics` su loopback: è l'indirizzo a cui il controllo di salute qui sotto chiede /ready.
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflared_token
    secrets:
      - cloudflared_token
    networks:
      - ingress
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      # 🔴 IL CONTROLLO DI PRIMA NON POTEVA DARE UN ESITO VERO (22/11/2026). Era `CMD-SHELL`
      #   con `… | grep -q healthy`: l'immagine non ha una shell (provato: `/bin/sh` non
      #   esiste), quindi il comando falliva sempre e il container restava «unhealthy» anche
      #   col tunnel su; e `grep healthy` avrebbe trovato anche «unhealthy». Ora si usa il
      #   comando che cloudflared ha per questo: `tunnel ready` chiede /ready al proprio
      #   endpoint e torna 0 solo con almeno una connessione attiva verso Cloudflare.
      #   Provato senza tunnel: esce 1 («connection refused»). NON provato con un tunnel vero.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 60s
      timeout: 5s
      retries: 3

  gateway:
    networks:
      - backend
      - ingress

secrets:
  cloudflared_token:
    file: ./secrets/cloudflared_token.txt
